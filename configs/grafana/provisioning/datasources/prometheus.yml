# =============================================================================
# Grafana datasource provisioning — wires Prometheus in automatically on boot.
# Mounted read-only at /etc/grafana/provisioning/datasources/ (see the
# `grafana` service in docker-compose.yml). No manual "add datasource" click.
# =============================================================================
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
