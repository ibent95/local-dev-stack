# =============================================================================
# OpenTelemetry Collector — the single OTLP endpoint for the LDS monitoring
# profile. Bind-mounted read-only into lds-otel-collector at
# /etc/otelcol-contrib/config.yml (restart with: lds restart monitoring).
#
# Apps send OTLP to ONE address — otel-collector:4317 (gRPC) or :4318 (HTTP),
# or 127.0.0.1:4317 / :4318 from the host — and the collector fans out:
#   traces  → Tempo            (otlp/tempo, gRPC)
#   logs    → Loki             (otlphttp/loki, Loki's native /otlp endpoint)
#   metrics → Prometheus       (prometheusremotewrite, /api/v1/write)
#
# The `debug` exporter prints a one-line summary of every batch at `basic`
# verbosity, which is the quickest way to confirm an app is actually emitting.
# =============================================================================
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Shed load instead of OOM-ing: this profile is capped at 384m.
  memory_limiter:
    check_interval: 2s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    # The collector's own health metrics. Without an explicit pull reader it
    # binds localhost only, so Prometheus (another container) gets nothing.
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
