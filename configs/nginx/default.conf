# =============================================================================
# Devilbox-style mass virtual hosting.
#   - <folder>.test            -> /var/www/<folder>  (docroot auto-detected)
#   - anything else / localhost -> control-panel dashboard
# Docroot priority per project:  public/  >  htdocs/  >  folder root
# =============================================================================

# Silence the per-request access log entirely in local dev. Every request
# writes a line to disk (I/O), and in dev you rarely check these — error_log
# is the useful one. Disabling access_log saves ~1 write per request.
# Servers can override this per-location (e.g., static files already had it).
access_log off;

# Cache file metadata (stat results) so directory existence checks from the
# if (-d) docroot detection below are much cheaper on warm requests.
open_file_cache          max=4000 inactive=60s;
open_file_cache_valid    120s;
open_file_cache_min_uses 1;
open_file_cache_errors   on;

# Optimize TCP/static file delivery
# sendfile and tcp_nopush are already set in the base nginx.conf
# (both Alpine and Debian ship with them). Only tcp_nodelay is added here.
tcp_nodelay    on;

# Limit per sendfile() call to 512K. Prevents a single large file delivery
# from monopolizing an nginx worker process — the transfer is broken into
# chunks so the worker can handle other requests interleaved.
sendfile_max_chunk 512k;

# Tune output buffering: 4 buffers of 32k each for the header+body pipeline.
# Reduces the number of writev() syscalls when sending responses to clients.
output_buffers 4 64k;

# Reduce overhead — keep connections alive for more requests
keepalive_requests 500;
keepalive_timeout  65s;

# Compression — speeds up transfers by ~70% for text-based responses.
# gzip on; is already set in Debian's base nginx.conf — only add overrides.
# gzip_proxied is not set by default.
gzip_proxied    any;
gzip_comp_level 2;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

# FastCGI buffer tuning. PHP responses benefit from larger buffers — instead of
# streaming byte-by-byte (which generates many tiny TCP packets), nginx buffers
# the full response from php-fpm and sends it in large chunks. This reduces
# TCP overhead and context switches for both nginx and php-fpm.
fastcgi_buffering  on;
fastcgi_buffers    16 16k;
fastcgi_buffer_size 64k;
fastcgi_busy_buffers_size 64k;
fastcgi_temp_file_write_size 64k;

# --- Static asset caching ---
# Browser cache for common static assets (fingerprinted files get 30-day
# expires; non-fingerprinted files revalidate via ETag).

# --- Control panel (default site) --------------------------------------------
# Served from /var/lds-dashboard (mounted outside /var/www), so it is NOT a
# project and has no <name>.test host of its own — reach it at http://localhost.
server {
    listen 80 default_server;
    server_name _;

    root /var/lds-dashboard;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files bypass php-fpm entirely (served directly by nginx).
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_read_timeout 60s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# --- Per-project hosting: <folder>.test --------------------------------------
server {
    listen 80;
    server_name ~^(?<sname>.+)\.test$;

    # Auto-detect docroot. Later matches win, so public/ has top priority.
    # With open_file_cache above (max=4000 inactive=60s, min_uses=1), the
    # stat() calls from these if (-d) checks hit the kernel's dentry cache
    # after the first request, making subsequent checks near-zero cost.
    set $docroot /var/www/$sname;
    if (-d /var/www/$sname/htdocs) { set $docroot /var/www/$sname/htdocs; }
    if (-d /var/www/$sname/public) { set $docroot /var/www/$sname/public; }
    root $docroot;

    index index.php index.html;

    # Static files — served directly by nginx without hitting php-fpm
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_read_timeout 60s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
