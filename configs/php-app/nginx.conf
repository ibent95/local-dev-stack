# Global default vhost for php-fpm app projects (docroot public/).
# php-fpm runs in the SAME container (supervisord), so fastcgi -> Unix socket.

# Silence per-request access log — local dev doesn't need it.
access_log off;

# Compression — speeds up transfers by ~70% for text-based responses.
# gzip on; is already set in Debian's base nginx.conf — only add overrides.
gzip_proxied    any;
gzip_comp_level 2;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

# FastCGI buffer tuning — reduces TCP packet count by buffering PHP responses
# into larger chunks before sending them to the client.
fastcgi_buffering  on;
fastcgi_buffers    16 16k;
fastcgi_buffer_size 32k;
fastcgi_busy_buffers_size 64k;
fastcgi_temp_file_write_size 64k;

# Limit per sendfile() call — prevents large files from blocking workers.
sendfile_max_chunk 512k;

# Output buffer tuning — fewer writev() syscalls per response.
output_buffers 4 32k;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files — served directly by nginx without hitting php-fpm.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        log_not_found off;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
