# Reduce Hive Metastore log spam
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c{1} - %m%n

# Quiet down verbose packages
log4j.logger.DataNucleus=WARN
log4j.logger.DataNucleus.Datastore=WARN
log4j.logger.DataNucleus.Query=WARN
log4j.logger.org.apache.hadoop=WARN
log4j.logger.org.apache.hive=INFO
log4j.logger.thrift=WARN
