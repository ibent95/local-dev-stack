# Resolve every *.test name to localhost (where nginx listens on :80).
address=/test/127.0.0.1

# Host-facing view only — eth0 (the lds-network NIC). The in-network view lives
# on the second NIC (lds-dnsnet, 172.28.0.53) as a SEPARATE dnsmasq process
# (entrypoint.sh), so the two answers for *.test never conflict.
interface=eth0

# Bind only to the selected interface address(es). This keeps port :53 free on
# lds-dnsnet so the in-network dnsmasq instance can bind 10.99.0.53.
bind-interfaces

# Don't read the container's /etc/resolv.conf; forward other queries upstream
# so normal internet DNS keeps working while your adapter points here.
no-resolv
server=8.8.8.8
server=1.1.1.1

# Cache for faster repeated lookups (reduces upstream DNS queries).
cache-size=150
