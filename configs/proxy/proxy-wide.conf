# Proxy-wide nginx override (mounted into /etc/nginx/conf.d/, see the
# nginx-proxy "Proxy-wide configuration" docs). nginx's default body limit is
# 1m, which 413's normal uploads through <name>.test (SnapOtter accepts up to
# SNAPOTTER_MAX_UPLOAD_SIZE_MB = 200, Superset/Penpot imports, Hop files...).
# Keep in sync with SNAPOTTER_MAX_UPLOAD_SIZE_MB if you raise it.
client_max_body_size 200m;
