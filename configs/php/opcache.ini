; OPcache tuned for local development (revalidate often)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
; Revalidate every 2s instead of every request — code changes reflect within 2s
; without the per-request stat overhead.
; 300s (5 min) between stat() batches. On slow bind mounts (Windows Docker), each stat()
; costs 10-50ms. With 300s between batches, 99.9% of requests hit shared memory directly
; with zero filesystem I/O. To force immediate revalidation, run:
;   docker exec lds-php php -r 'opcache_reset();'
opcache.revalidate_freq = 300
opcache.fast_shutdown = 1
; Prevent stale entries from filling up the cache over time.
; When 10% of cache is wasted (stale entries awaiting garbage collection),
; OPcache will restart validation, freeing memory for fresh scripts.
opcache.max_wasted_percentage = 10
; PHP 8.4+ JIT compilation — the single biggest PHP performance win.
; Framework bootstrapping (autoloading hundreds of classes, service container
; compilation, route registration, template rendering) is CPU-bound, not
; I/O-bound, and JIT compiles these hot paths to native machine code.
; 'tracing' mode profiles code at runtime to find the hottest paths and
; compiles only those — best balance for web apps (vs 'function' which
; compiles every function). See also: opcache.jit=on-the-fly in 8.4+.
; 128MB buffer is generous for most modern frameworks.
opcache.jit = tracing
opcache.jit_buffer_size = 64M
; OPcache file cache — persists compiled PHP to disk so the first request
; after a container restart doesn't need to recompile every script from
; scratch. This is a fallback cache (not file_cache_only), so OPcache still
; uses shared memory as the primary cache and falls back to disk on restart.
opcache.file_cache = /tmp/opcache-file
opcache.file_cache_only = 0
