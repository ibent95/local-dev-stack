# Dependabot version updates for local-dev-stack.
#
# Note: most image tags in docker-compose.yml are interpolated
# (${MYSQL_VERSION:-…} etc. from .env.example) - Dependabot can only bump the
# LITERAL tags here (nginx-proxy, apache/hive, …). Env-driven versions are
# bumped by hand in .env.example together with the compose default (see
# CONTRIBUTING.md), and template manifests are updated deliberately rather
# than automatically.
version: 2
updates:
  # GitHub Actions (.github/workflows/desktop-build.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # Compose stack images with literal tags
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  # --- Desktop apps (desktop/) ---
  - package-ecosystem: "maven"
    directory: "/desktop/javafx"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "composer"
    directory: "/desktop/nativephp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/desktop/nativephp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "cargo"
    directory: "/desktop/tauri/src-tauri"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      # RUSTSEC-2024-0429: glib <0.20 unsoundness. Blocked upstream — gtk 0.18
      # (via wry) pins glib ^0.18; the fix needs Tauri's GTK3 -> GTK4 migration
      # (tauri-apps/tauri#12561-12563, wry#1474). Dismissed manually as
      # tolerable risk; ignore stops dependabot from re-raising it.
      - dependency-name: "glib*"

  - package-ecosystem: "cargo"
    directory: "/desktop/dioxus"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      # Same glib advisory as above — blocked on the same gtk-rs stack.
      - dependency-name: "glib*"
      # rand <0.8.6 unsoundness (logger/ThreadRng aliasing): the only copy is
      # rand 0.7.3, a BUILD-dependency (selectors -> phf_codegen ->
      # phf_generator) that never ships in the app; no 0.7.x patch exists and
      # selectors 0.24 pins the phf 0.8 line. Dismissed as tolerable risk.
      - dependency-name: "rand"
        versions: ["< 0.8.6"]

  # --- Stack apps: analytics / tasks / wiki (lockfiles are git-ignored, so
  # these PRs update the version ranges in package.json) ---
  - package-ecosystem: "npm"
    directory: "/configs/analytics/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/configs/analytics/ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/configs/tasks/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/configs/tasks/ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/configs/wiki/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/configs/wiki/ui"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
