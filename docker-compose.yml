# =============================================================================
# Local Development Stack — shared infrastructure for all projects
# -----------------------------------------------------------------------------
# Every service group is gated behind a Compose PROFILE so you only start what
# you need. All services join the shared external network ${NETWORK_NAME}
# (default: lds-network) so your application projects can attach to it too.
#
#   Start a group:   docker compose --profile mysql --profile redis up -d
#   Start Kafka:     docker compose --profile kafka up -d
#   Everything:      docker compose --profile all up -d
#   Stop:            docker compose --profile '*' down      (or use scripts/run)
#
# Services are ordered by importance of usage: web foundation → databases →
# admin UIs → data tools → web utilities → LDS apps → … → realtime brokers →
# Kafka (heaviest, off by default).
# Profiles: proxy | php | mysql | mariadb | mssql | oracle | postgres | mongo | redis | valkey | memcached |
#           phpcacheadmin | dbx | drawdb | hop | superset | metabase | hoppscotch | plane |
#           semgrep | zap | trivy | crg |
#           vaultwarden | mail | penpot | instatic | analytics | tasks | wiki |
#           soketi | centrifugo | mqtt | kafka | openwa | rustfs | headlessx |
#           playwright | erpnext | duckdb | trino | hive-metastore |
#           snapotter | imgcompress | drawio | lldap | openldap | monitoring | all
#
# Host port layout (all in the 44xx-45xx block):
#   4400-4419  Databases      (MySQL, MariaDB, MSSQL, Oracle, Postgres, Mongo, Redis, Valkey, Memcached)
#   4420-4439  Kafka          (Broker, Schema Registry, Connect, UI)
#   4440-4449  Realtime       (Soketi, Centrifugo, Mosquitto, MQTTX)
#   4450-4459  Query engines  (DuckDB, Trino)
#   4500-4543  Web UIs & apps (phpCacheAdmin, DBX, DrawDB, Hop, Superset, Metabase, Hoppscotch,
#                             Plane, Semgrep, ZAP, Trivy, CRG, Vaultwarden, Mailpit, Penpot,
#                             Instatic, HeadlessX, Playwright, ERPNext, OpenWA, RustFS, Analytics,
#                             Tasks, Wiki, SnapOtter, Grafana, Prometheus, ImgCompress, draw.io,
#                             LLDAP, OpenLDAP)
#   Data tools (drawdb/hop/superset/semgrep/zap/trivy/vaultwarden) + the http://localhost control panel:
#   see docs/en/15-data-tools.md.
# =============================================================================

name: local-dev-stack

# -----------------------------------------------------------------------------
# Reusable anchors
# -----------------------------------------------------------------------------
x-restart: &restart unless-stopped

# DNS tuning: fast timeout + single attempt to avoid multi-second stalls on
# container startup when a dependency's hostname isn't immediately resolvable.
x-dns-opts: &dns
  dns_opt:
    - timeout:1
    - attempts:1

# Plane CE env anchors — adapted from the vendor file
# (deployments/cli/community/docker-compose.yml). DB + cache point at the
# SHARED stack services: dedicated lds_plane database on the shared postgres
# (created by POSTGRES_INIT_SPECS) and the shared redis (logical DB 0 —
# HeadlessX/ERPNext/SnapOtter use 4/5+6/7). RabbitMQ is the shared broker
# (service rabbitmq). Object storage is the shared
# RustFS (S3-compatible) instead of a private MinIO. Every var that shipped
# without a default got one (LDS convention).
x-plane-db-env: &db-env
  PGHOST: ${PGHOST:-postgres}
  PGDATABASE: ${PGDATABASE:-lds_plane}
  POSTGRES_USER: ${PLANE_PGUSER:-${POSTGRES_USER:-app}}
  POSTGRES_PASSWORD: ${PLANE_PGPASSWORD:-${POSTGRES_PASSWORD:-app}}
  POSTGRES_DB: ${PLANE_PGDB:-lds_plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

x-plane-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${PLANE_REDIS_URL:-redis://redis:6379/}

x-plane-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-${RUSTFS_ACCESS_KEY:-lds-rustfs-admin}}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-${RUSTFS_SECRET_KEY:-lds-rustfs-secret-change-me}}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://rustfs:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-plane-proxy-env: &proxy-env
  APP_DOMAIN: ${PLANE_APP_DOMAIN:-plane.test}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  CERT_EMAIL: ${CERT_EMAIL:-}
  CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
  CERT_ACME_DNS: ${CERT_ACME_DNS:-}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-plane-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SECRET_KEY:-plane-live-dev-secret-change-me}

x-plane-app-env: &app-env
  WEB_URL: ${PLANE_WEB_URL:-http://plane.test}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${PLANE_CORS_ORIGINS:-http://plane.test,http://localhost:4543}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${PLANE_DATABASE_URL:-postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/lds_plane}
  SECRET_KEY: ${PLANE_SECRET_KEY:-plane-dev-secret-key-change-me}
  AMQP_URL: ${AMQP_URL:-amqp://${RABBITMQ_USER:-app}:${RABBITMQ_PASSWORD:-app}@rabbitmq:5672/${RABBITMQ_VHOST:-app}}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${PLANE_LIVE_SECRET_KEY:-plane-live-dev-secret-change-me}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

services:
  # ===========================================================================
  # Web — Devilbox-style multi-project hosting  (profile: php, all)
  #   php : ONE container running supervisord -> php-fpm + nginx (base lds/php).
  #         Mass virtual hosting — every folder in ${PHP_PROJECTS_PATH} is served at
  #         <folder>.test (docroot auto-detected: public/ > htdocs/ > root),
  #         via the mounted mass-vhost nginx config (overrides the baked default).
  #   proxy : edge router (nginx-proxy) — see below.
  #   dns : dnsmasq resolving *.test -> 127.0.0.1 so new folders are instantly
  #         reachable with no hosts-file edits.
  # ===========================================================================
  php:
    # Single base image lds/php = php-fpm + nginx + supervisor (./lds.sh build-bases).
    image: lds/php:${PHP_VERSION:-8.4}
    container_name: lds-php
    profiles: [php, all]
    restart: *restart
    # Catch-all host; app containers with an exact VIRTUAL_HOST win at the proxy.
    # `localhost` (and any unmatched host) lands on the __dashboard control panel.
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: "localhost,~^.+\\.test$$"
      VIRTUAL_PORT: "80"
      ENABLE_PHP: "true"
      ENABLE_NGINX: "true"
    # Bound DNS retries: the __dashboard control panel probes every service, and a
    # DOWN service's name resolution (Docker embedded DNS forwarding upstream) can
    # otherwise take ~4s. timeout:1/attempts:1 caps that to ~1s so probes stay
    # snappy (the dashboard also time-budgets probing as the hard 504 guarantee).
    dns_opt:
      - timeout:1
      - attempts:1
    expose:
      - "80"
    volumes:
      - ${PHP_PROJECTS_PATH:-./www}:/var/www
      # Control panel for http://localhost. Mounted OUTSIDE /var/www so it isn't a
      # fake project (no __dashboard.test) and never shows up in the project list.
      - ./configs/web/dashboard:/var/lds-dashboard:ro
      # Bilingual handbook (docs/{en,id}) — read-only, rendered in-browser by
      # the control panel's docs.php. Live: edit a .md and it shows up at once.
      - ./docs:/var/lds-docs:ro
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./configs/php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./configs/php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro
      - ./configs/php-app/fpm/www.conf:/etc/php/8.4/fpm/pool.d/www.conf:ro
    healthcheck:
      # Use 127.0.0.1 (NOT localhost): localhost also resolves to ::1 and busybox
      # wget tries IPv6 first, but nginx listens IPv4-only -> refused. Hit the cheap
      # /?health=1 path (no service probing) so health reflects the web server being
      # up, not the dashboard's probe latency.
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1/?health=1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    cpus: ${PHP_CPUS:-2}
    mem_limit: ${PHP_MEM_LIMIT:-512m}
    networks: [lds-network]

  # Edge reverse proxy (profile: proxy, php, all)
  #   Routes <name>.test -> any container that sets VIRTUAL_HOST. This is how
  #   Go / Rust / Java / Node apps get a hostname. PHP projects fall through to
  #   the mass-vhost php container above (its regex VIRTUAL_HOST is the catch-all).
  proxy:
    image: nginxproxy/nginx-proxy:1.6
    container_name: lds-proxy
    profiles: [proxy, php, all]
    restart: *restart
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-80}:80"
    environment:
      DEFAULT_HOST: localhost
      # Use Docker's embedded DNS as the resolver (127.0.0.11 inside the container)
      # with a short TTL so upstream container IP changes are picked up quickly.
      RESOLVERS: "127.0.0.11"
      # Increase worker connections for higher concurrency (default is 1024).
      # Each upstream connection uses one worker connection; with keepalive,
      # 2048 handles ~1000 concurrent keepalive connections without exhaustion.
      WORKER_CONNECTIONS: "2048"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # Proxy-wide nginx overrides (client_max_body_size — nginx defaults to
      # 1m, which 413's uploads to SnapOtter & friends).
      - ./configs/proxy/proxy-wide.conf:/etc/nginx/conf.d/proxy-wide.conf:ro
    # Aggressive DNS timeouts — the nginx-proxy resolver looks up upstream
    # container hostnames via Docker DNS. timeout:1 / attempts:1 ensures a DNS
    # hiccup doesn't stall the request for more than ~1s.
    dns_opt:
      - timeout:1
      - attempts:1
    mem_limit: ${PROXY_MEM_LIMIT:-256m}
    networks: [lds-network]

  dns:
    build:
      context: configs/dns
      args:
        DHI_REGISTRY: ${DHI_REGISTRY:-dhi.io}
    image: ${REGISTRY:-local}/local-dev-stack/dns:latest
    container_name: lds-dns
    profiles: [proxy, php, all]
    restart: *restart
    ports:
      - "127.0.0.1:${DNS_HOST_PORT:-53}:53/udp"
      - "127.0.0.1:${DNS_HOST_PORT:-53}:53/tcp"
    # Two DNS views in one container (see configs/dns/entrypoint.sh):
    #   A — eth0 (host-facing, published :53): resolves *.test -> 127.0.0.1
    #       for the HOST (adapter DNS / hosts file). Unchanged behaviour.
    #   B — 10.99.0.53 on lds-dnsnet: an IN-NETWORK view that resolves *.test
    #       -> the proxy container IP, so browser tools inside the stack (e.g.
    #       OWASP ZAP scanning http://myapp.test) can reach local apps. Static
    #       IP because it's used as a per-container `dns:` server (IPs only).
    networks:
      lds-network: {}
      lds-dnsnet:
        ipv4_address: 10.99.0.53

  # ===========================================================================
  # MySQL  (profile: mysql, all)
  #   binlog enabled in ROW format so Debezium CDC works out of the box.
  #   Self-initializing: --init-file creates the app database + user on every
  #   startup (idempotent via CREATE IF NOT EXISTS). No external init script needed.
  # ===========================================================================
  mysql:
    image: ${DHI_REGISTRY:-dhi.io}/mysql:${MYSQL_VERSION:-8.4-debian13}
    container_name: lds-mysql
    profiles: [mysql, all]
    restart: *restart
    <<: *dns
    # DHI mysql only enters "mysqld mode" when argv[0] is `mysqld` (the official
    # image auto-prepends it; DHI does not), so pass it explicitly.
    # --init-file runs the bootstrap SQL on every startup (idempotent).
    command:
      - mysqld
      - --init-file=/docker-entrypoint-initdb.d/00-init.sql
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --server-id=${MYSQL_SERVER_ID:-1}
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-4400}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./configs/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD:-root} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    networks: [lds-network]

  # ===========================================================================
  # MariaDB  (profile: mariadb, all)
  #   Drop-in MySQL-compatible fork, hardened DHI image. utf8mb4 server defaults.
  #   Used by ERPNext only when ERPNEXT_DB_TYPE=mariadb (the default is postgres).
  # ===========================================================================
  mariadb:
    image: ${DHI_REGISTRY:-dhi.io}/mariadb:${MARIADB_VERSION:-11.8-debian13}
    container_name: lds-mariadb
    profiles: [mariadb, all]
    restart: *restart
    <<: *dns
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-app}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${MARIADB_HOST_PORT:-4406}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${MARIADB_MEM_LIMIT:-1g}
    networks: [lds-network]

  # ===========================================================================
  # Microsoft SQL Server 2025 — Developer edition  (profile: mssql, all)
  #   Free for development/testing (ACCEPT_EULA=Y is the license consent, not a
  #   purchase). HARD requirements: MSSQL_SA_PASSWORD must satisfy the SQL Server
  #   password policy (8+ chars, 3 of 4: upper/lower/digit/symbol) or the server
  #   exits on boot, and MSSQL_MEM_LIMIT must stay >= 2g (SQL Server needs it).
  #   ~1.5 GB image; first boot runs setup before accepting connections.
  #   Microsoft's tag scheme is <year>-latest (2025-latest); the previous major
  #   is still available as 2022-latest.
  # ===========================================================================
  mssql:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2025-latest}
    container_name: lds-mssql
    profiles: [mssql, all]
    restart: *restart
    <<: *dns
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Lds-dev-2024!}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${MSSQL_HOST_PORT:-4407}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${MSSQL_MEM_LIMIT:-2g}
    networks: [lds-network]

  # ===========================================================================
  # Oracle Database Free (23ai)  (profile: oracle, all)
  #   Free developer license. Uses the gvenzl/oracle-free mirror so NO Oracle
  #   account is needed (the official container-registry.oracle.com image
  #   requires a login). ORACLE_PASSWORD sets the SYS/SYSTEM password (required).
  #   First boot creates the DB (~1-2 min, several GB disk); the `slim` image is
  #   ~3 GB. EM Express web console on :5500 (https://localhost:4409/em).
  # ===========================================================================
  oracle:
    image: gvenzl/oracle-free:${ORACLE_VERSION:-23.26.2-slim}
    container_name: lds-oracle
    profiles: [oracle, all]
    restart: *restart
    <<: *dns
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Oracle-dev-2024!}
      ORACLE_DATABASE: ${ORACLE_DATABASE:-FREE}
      ORACLE_USER: ${ORACLE_USER:-app}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${ORACLE_HOST_PORT:-4408}:1521"
      - "127.0.0.1:${ORACLE_EM_HOST_PORT:-4409}:5500"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    mem_limit: ${ORACLE_MEM_LIMIT:-2g}
    networks: [lds-network]

  # ===========================================================================
  # PostgreSQL  (profile: postgres, penpot, all)
  #   wal_level=logical so Debezium CDC works out of the box.
  #   Self-initializing: background the DHI entrypoint (handles initdb + setup),
  #   then creates extra databases from POSTGRES_INIT_SPECS and runs init SQL
  #   scripts. No external init script needed.
  # ===========================================================================
  postgres:
    image: ${DHI_REGISTRY:-dhi.io}/postgres:${POSTGRES_VERSION:-18.4-alpine3.24}
    container_name: lds-postgres
    profiles: [postgres, analytics, tasks, wiki, openwa, trino, penpot, headlessx, erpnext, snapotter, hoppscotch, superset, metabase, plane, all]
    restart: *restart
    <<: *dns
    # Override entrypoint so we can init databases AFTER postgres starts.
    # The original DHI entrypoint is run in background (handles initdb + setup),
    # then our script creates extra databases and runs init SQL.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Run the DHI entrypoint in background (initdb, user setup, then exec postgres)
        # Pass ONLY config flags (no leading "postgres") — the DHI entrypoint
        # handles them the same way as the original compose command.
        /usr/local/bin/docker-entrypoint.sh \
          -c wal_level=logical \
          -c max_wal_senders=10 \
          -c max_replication_slots=10 \
          -c tcp_keepalives_idle=60 \
          -c tcp_keepalives_interval=10 \
          -c tcp_keepalives_count=6 \
          -c statement_timeout=30000 &
        PG_PID=$$!

        # Wait for postgres to accept connections
        echo "Waiting for PostgreSQL..."
        for i in $$(seq 1 30); do
          pg_isready -U "$${POSTGRES_USER:-app}" -q 2>/dev/null && break
          sleep 2
        done
        echo "PostgreSQL ready — initializing databases..."

        # Create extra databases from POSTGRES_INIT_SPECS (comma-separated db:user:pass)
        OLD_IFS="$$IFS"; IFS=','
        for spec in $${POSTGRES_INIT_SPECS:-}; do
          [ -z "$$spec" ] && continue
          db="$$(echo "$$spec" | cut -d: -f1)"
          u="$$(echo "$$spec" | cut -d: -f2)"
          p="$$(echo "$$spec" | cut -d: -f3)"
          [ -z "$$db" ] || [ -z "$$u" ] || [ -z "$$p" ] && continue
          psql -U "$${POSTGRES_USER:-app}" -d postgres \
            -c "CREATE DATABASE \"$$db\" OWNER \"$$u\";" 2>/dev/null || true
          psql -U "$${POSTGRES_USER:-app}" -d postgres \
            -c "GRANT CONNECT ON DATABASE \"$$db\" TO \"$$u\";" 2>/dev/null || true
          psql -U "$${POSTGRES_USER:-app}" -d "$$db" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO \"$$u\";
                 GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"$$u\";
                 GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO \"$$u\";" 2>/dev/null || true
          echo "  Database '$$db' + user '$$u' ready"
        done
        IFS="$$OLD_IFS"

        # Run init SQL scripts from /docker-entrypoint-initdb.d/ (table schemas)
        for f in /docker-entrypoint-initdb.d/*.sql /docker-entrypoint-initdb.d/*.sh; do
          [ -f "$$f" ] || continue
          case "$$f" in
            *.sql)
              echo "  applying $$(basename $$f)..."
              psql -U "$${POSTGRES_USER:-app}" -d "$${POSTGRES_DB:-app}" -f "$$f" >/dev/null 2>&1 || true ;;
            *.sh)
              echo "  running $$(basename $$f)..."
              bash "$$f" >/dev/null 2>&1 || true ;;
          esac
        done

        echo "PostgreSQL ready"
        wait $$PG_PID
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_INIT_SPECS: ${POSTGRES_INIT_SPECS:-}
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-4401}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/18/data
      - ./configs/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    networks: [lds-network]

  # ===========================================================================
  # MongoDB  (profile: mongo, all)
  #   Single-node REPLICA SET (rs0) so change streams / Debezium CDC work, WITH
  #   auth (root + app users, like mysql/postgres). Replica set + auth mandates a
  #   keyfile (internal auth); it's auto-generated into the mongo-config volume on
  #   first boot. Uses the DHI `-dev` flavor for the shell (keyfile gen) + mongosh
  #   (mongo-init creates the users + the healthcheck). The official
  #   docker-entrypoint.sh isn't on DHI, so we exec mongod directly (the image
  #   defaults to root, so the keyfile chmod/chown works). Users are created by
  #   scripts/run/mongo-init.* (auto-run by `lds up`), NOT MONGO_INITDB_*.
  # ===========================================================================
  mongo:
    image: ${DHI_REGISTRY:-dhi.io}/mongodb:${MONGO_VERSION:-8.3-debian13-dev}
    container_name: lds-mongo
    profiles: [mongo, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    entrypoint:
      - bash
      - -c
      - |
        KF=/etc/mongo/keyfile
        mkdir -p /etc/mongo
        [ -s "$$KF" ] || head -c 756 /dev/urandom | base64 | tr -d '\n' > "$$KF"
        chmod 400 "$$KF"
        exec mongod --replSet rs0 --keyFile "$$KF" --bind_ip_all
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-4402}:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/etc/mongo
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [lds-network]

  # ===========================================================================
  # Redis  (profile: redis, all)
  # ===========================================================================
  redis:
    image: ${DHI_REGISTRY:-dhi.io}/redis:${REDIS_VERSION:-8.8-alpine3.24}
    container_name: lds-redis
    profiles: [redis, headlessx, erpnext, snapotter, plane, all]
    restart: *restart
    <<: *dns
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-4403}:6379"
    volumes:
      - redis-data:/data
      - ./configs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [lds-network]

  # ===========================================================================
  # Valkey  (profile: valkey, penpot, all)
  #   Redis-compatible cache/data store. Persisted via appendonly on host bind.
  # ===========================================================================
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8.1-alpine}
    container_name: lds-valkey
    profiles: [valkey, penpot, all]
    restart: *restart
    <<: *dns
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1", "--dir", "/data"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-4405}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [lds-network]

  # ===========================================================================
  # Memcached  (profile: memcached, all)
  # ===========================================================================
  memcached:
    image: ${DHI_REGISTRY:-dhi.io}/memcached:${MEMCACHED_VERSION:-1.6-debian13}
    container_name: lds-memcached
    profiles: [memcached, all]
    restart: *restart
    <<: *dns
    command: ["memcached", "-m", "${MEMCACHED_MEMORY:-64}", "-p", "11211"]
    ports:
      - "127.0.0.1:${MEMCACHED_HOST_PORT:-4404}:11211"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo stats | timeout 2 nc -w 1 127.0.0.1 11211 | grep -q uptime",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [lds-network]

  # ===========================================================================
  # RabbitMQ — shared AMQP/message broker  (profile: rabbitmq, plane, all)
  #   One broker for the whole stack (Plane is the first consumer). Provisioned
  #   on first boot from RABBITMQ_USER/PASSWORD/VHOST. AMQP on the loopback
  #   host port (default 4410), management UI on 4411.
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-3.13.6}-management-alpine
    container_name: lds-rabbitmq
    profiles: [rabbitmq, plane, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-app}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-4410}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-4411}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    mem_limit: ${RABBITMQ_MEM_LIMIT:-512m}
    networks: [lds-network]

  # ===========================================================================
  # Admin tools — web UIs for the backing services. Each has its OWN profile
  # (phpcacheadmin | dbx) so you can turn them on independently; both also
  # join `all`. Reachable via the proxy (*.test) AND a direct host port. They
  # show data only when the matching profile is also up (redis/memcached,
  # mysql/postgres).
  # ===========================================================================
  # phpCacheAdmin — Redis + Memcached + OPcache/APCu browser.  (profile: phpcacheadmin, all)
  phpcacheadmin:
    image: robinn/phpcacheadmin:${PHPCACHEADMIN_VERSION:-2.5.2}
    container_name: lds-phpcacheadmin
    profiles: [phpcacheadmin, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${CACHE_ADMIN_HOST:-cache.test}
      VIRTUAL_PORT: "80"
      CERT_NAME: _.test
      PCA_REDIS_0_NAME: "LDS Redis"
      PCA_REDIS_0_HOST: redis
      PCA_REDIS_0_PORT: "6379"
      PCA_REDIS_1_NAME: "LDS Valkey"
      PCA_REDIS_1_HOST: valkey
      PCA_REDIS_1_PORT: "6379"
      PCA_MEMCACHED_0_NAME: "LDS Memcached"
      PCA_MEMCACHED_0_HOST: memcached
      PCA_MEMCACHED_0_PORT: "11211"
    expose:
      - "80"
    ports:
      - "127.0.0.1:${CACHE_ADMIN_HOST_PORT:-4500}:80"
    networks: [lds-network]

  # DBX — web DB client (100+ engines: MySQL, Postgres, Mongo, SQL Server,
  # Oracle, Redis, DuckDB, ...).  (profile: dbx, all)
  # Persistence: bind-mounted host dir (data/dbx/) holds dbx.db + the connection
  # encryption key (.dbx/secret.key) — directly accessible on disk for backup
  # or sharing. Seeded with the stack DBs by scripts/run/dbx-seed.* (post-up
  # hook) through DBX's Web API, so it works without touching the SQLite file.
  dbx:
    image: t8y2/dbx:${DBX_VERSION:-0.6.31}
    container_name: lds-dbx
    profiles: [dbx, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${DB_ADMIN_HOST:-db.test}
      VIRTUAL_PORT: "4224"
      CERT_NAME: _.test
      # Local-dev default: no login wall (the stack DBs are already open on the
      # shared network) and it lets `dbx-seed` POST connections without a session
      # cookie. Set DBX_DISABLE_PASSWORD=0 in .env to gate the UI behind a login
      # (DBX_PASSWORD is then used; it is ignored entirely while disabled).
      DBX_DISABLE_PASSWORD: ${DBX_DISABLE_PASSWORD:-1}
      DBX_PASSWORD: ${DBX_PASSWORD:-dbx}
      # Container-internal listen port (host side is DB_ADMIN_HOST_PORT below).
      DBX_PORT: "4224"
    expose:
      - "4224"
    ports:
      - "127.0.0.1:${DB_ADMIN_HOST_PORT:-4501}:4224"
    volumes:
      # dbx.db + .dbx/secret.key — persist them together, they are a pair.
      - ./data/dbx:/app/data
      # Shared writable view of the DuckDB data engine (the duckdb service's
      # volume): DuckDB creates a lock/WAL file even for reads, so the mount must
      # be writable. Set the DuckDB connection to read-only in the DBX UI to avoid
      # write contention with the duckdb service.
      - duckdb-data:/data
    healthcheck:
      # Debian-slim ships no curl/wget — open the listener with bash /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4224'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: ${DBX_MEM_LIMIT:-768m}
    networks: [lds-network]

  # ===========================================================================
  # Database design — ER diagrams / schema modelling.  (profile: drawdb, all)
  # ===========================================================================
  # DrawDB — browser-based database schema designer / ER diagrammer.
  # A static SPA (diagrams persist in your browser, no server DB). Upstream image
  # (not on DHI). Lightweight — single container. NOTE: open it at
  # http://localhost:4502, NOT drawdb.test — it calls crypto.randomUUID(), which
  # browsers expose only in a secure context (localhost or HTTPS).
  drawdb:
    image: ${DRAWDB_IMAGE:-ghcr.io/drawdb-io/drawdb}:${DRAWDB_VERSION:-v1.7.0}
    container_name: lds-drawdb
    profiles: [drawdb, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${DRAWDB_HOST:-drawdb.test}
      VIRTUAL_PORT: "80"
      CERT_NAME: _.test
    expose:
      - "80"
    ports:
      - "127.0.0.1:${DRAWDB_HOST_PORT:-4502}:80"
    mem_limit: ${DRAWDB_MEM_LIMIT:-128m}
    networks: [lds-network]

  # ===========================================================================
  # Data warehouse & BI — ETL + reporting.  (profiles: hop | superset | metabase, all)
  #   hop      : Apache Hop Web — design/run data-integration pipelines (ETL).
  #   superset : Apache Superset — BI dashboards & reporting over your DBs.
#   metabase : Metabase — simpler self-hosted BI dashboards (first-run setup wizard).
# Hop is an upstream image; Superset is a Docker Hardened Image; Metabase is
# the official upstream image (AGPL-3.0). All three are off by default. They
# connect to the stack DBs (postgres/mysql) as data sources —
  # add those connections in-app.
  # ===========================================================================
  # Apache Hop — Hop Web, the browser-based ETL/DW pipeline designer.  (profile: hop, all)
  # Uses apache/hop-web (Tomcat), NOT apache/hop (that one is the headless
  # hop-server, which forces Basic auth). Hop Web needs no login. The app serves
  # under /ui and redirects / -> /ui itself (using the request Host), so hop.test
  # opens straight into the designer. NB: /ui has NO trailing slash (/ui/ is a 404).
  # Persistence: bind-mounted host dirs (`data/hop/{config,audit}`) hold
  # projects, connections, and config (hop-config.json). This lets you access
  # pipelines/workflows directly on disk — edit, version, or back up your files
  # without touching the container. Use `down -v` to wipe the directories.
  hop:
    image: ${HOP_IMAGE:-apache/hop-web}:${HOP_VERSION:-2.18.1}
    container_name: lds-hop
    profiles: [hop, all]
    restart: *restart
    <<: *dns
    # "No session" timeout: Hop Web (Eclipse RAP) ties its UI state to the HTTP
    # session, which inherits Tomcat's 30-min conf/web.xml timeout — so after idle
    # you'd get "session timed out" and lose the canvas. We flip that to never
    # expire (<=0) before launching the stock startup script (image CMD). Regex
    # match survives a different default in future image versions.
    command:
      - /bin/bash
      - -c
      - |
        sed -i -E 's#<session-timeout>[0-9]+</session-timeout>#<session-timeout>-1</session-timeout>#' /usr/local/tomcat/conf/web.xml
        exec /bin/bash /tmp/run-web.sh
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${HOP_HOST:-hop.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${HOP_HOST_PORT:-4503}:8080"
    volumes:
      # Shared JDBC JARs are in assets/jdbc/ — download them from Maven Central
      # (see the comprehensive README at assets/jdbc/README.md). Each JAR is
      # mounted as a single-file volume without shadowing Hop's bundled drivers.
      # Bump both the filename and the matching ${HOP_*_DRIVER} in .env together.
      # MySQL Connector/J (GPL — not bundled).
      - ./assets/jdbc/${HOP_MYSQL_DRIVER:-mysql-connector-j-8.4.0.jar}:/usr/local/tomcat/jdbc-drivers/${HOP_MYSQL_DRIVER:-mysql-connector-j-8.4.0.jar}:ro
      # MariaDB JDBC (LGPL — not bundled).
      - ./assets/jdbc/${HOP_MARIADB_DRIVER:-mariadb-java-client-3.5.9.jar}:/usr/local/tomcat/jdbc-drivers/${HOP_MARIADB_DRIVER:-mariadb-java-client-3.5.9.jar}:ro
      # Oracle JDBC (Oracle Free Use Terms — not bundled).
      - ./assets/jdbc/${HOP_ORACLE_DRIVER:-ojdbc11-23.26.2.0.0.jar}:/usr/local/tomcat/jdbc-drivers/${HOP_ORACLE_DRIVER:-ojdbc11-23.26.2.0.0.jar}:ro
      # Microsoft SQL Server JDBC (Microsoft EULA — not bundled).
      - ./assets/jdbc/${HOP_MSSQL_DRIVER:-mssql-jdbc-12.8.1.jre11.jar}:/usr/local/tomcat/jdbc-drivers/${HOP_MSSQL_DRIVER:-mssql-jdbc-12.8.1.jre11.jar}:ro
      # PostgreSQL JDBC (override bundled version if needed).
      - ./assets/jdbc/${HOP_POSTGRESQL_DRIVER:-postgresql-42.7.4.jar}:/usr/local/tomcat/jdbc-drivers/${HOP_POSTGRESQL_DRIVER:-postgresql-42.7.4.jar}:ro
      # Trino JDBC (Apache 2.0 — not bundled).
      - ./assets/jdbc/${HOP_TRINO_DRIVER:-trino-jdbc-483.jar}:/usr/local/tomcat/jdbc-drivers/${HOP_TRINO_DRIVER:-trino-jdbc-483.jar}:ro
      # Persist Hop projects, connections, and config across container recreates.
      # Bind-mounted to the host (data/hop/*) so you can browse, edit, and
      # version-control your pipelines and workflows directly. Mount only the
      # user-data subdirs (not the entire ROOT) so the Hop app itself always
      # comes from the image.
      - ./data/hop/config:/usr/local/tomcat/webapps/ROOT/config
      - ./data/hop/audit:/usr/local/tomcat/webapps/ROOT/audit
      # Folder-per-project: each subfolder in HOP_PROJECTS_PATH is a Hop project.
      # Registered automatically via hop-conf on lds up (see scripts/run/hop-register.*).
      - ${HOP_PROJECTS_PATH:-./data/hop/projects}:${HOP_PROJECTS_CONTAINER_PATH:-/home/hop}
    mem_limit: ${HOP_MEM_LIMIT:-1g}
    networks: [lds-network]

  # Apache Superset — BI dashboards & reporting.  (profile: superset, all)
  # Docker Hardened Image, non-dev runtime variant: nonroot (UID 65532) and no
  # shell. Since the hardened image has no shell we can't `sh -c` the multi-step
  # self-init — but it's a Python app, so we drive init from the image's venv
  # python (/app/.venv/bin) and exec into gunicorn. Self-inits on start (db
  # upgrade + admin user + init); metadata in a local SQLite under
  # /app/superset_home (bind-mounted to SUPERSET_HOME on the host —
  # must be writable by UID 65532; see the gotcha below if you hit
  # "readonly database"). Folder-per-project: each subfolder in
  # SUPERSET_PROJECTS_PATH is a dashboard project (YAML exports). Registered
  # automatically on lds up (see scripts/run/superset-register.*). Visualize
  # the stack DBs — add them as Superset "Database" connections
  # (e.g. postgresql://app:app@postgres:5432/app).
  superset:
    image: ${DHI_REGISTRY:-dhi.io}/superset:${SUPERSET_VERSION:-6.1-debian13}
    container_name: lds-superset
    profiles: [superset, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${SUPERSET_HOST:-superset.test}
      VIRTUAL_PORT: "8088"
      CERT_NAME: _.test
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-lds-dev-secret-change-me}
      # Metadata DB = shared postgres (lds_superset, created by
      # POSTGRES_INIT_SPECS). MUST use the SUPERSET__-prefixed var — plain
      # SQLALCHEMY_DATABASE_URI is ignored by config.py's env processing.
      SUPERSET__SQLALCHEMY_DATABASE_URI: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${SUPERSET_POSTGRES_DB:-lds_superset}
      SUPERSET_LOAD_EXAMPLES: "no"
      SUPERSET_ADMIN: ${SUPERSET_ADMIN:-admin}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /app/.venv/bin/python
      - -c
      - |
        import importlib.util, os, subprocess
        bin = "/app/.venv/bin"
        # DB drivers (trino = Trino dialect, psycopg2 = shared-postgres metadata
        # DB). The venv's site-packages is root-owned and NOT writable by this
        # nonroot image, so install into the writable, PYTHONPATH-listed
        # /app/pythonpath instead — and only when the import is missing.
        def ensure(pkg, mod):
            if importlib.util.find_spec(mod) is None:
                subprocess.run([bin + "/pip", "install", "--quiet",
                                "--target", "/app/pythonpath", pkg], check=False)
        ensure("trino", "trino")
        ensure("psycopg2-binary", "psycopg2")
        subprocess.run([bin + "/superset", "db", "upgrade"], check=True)
        subprocess.run([bin + "/superset", "fab", "create-admin",
            "--username", os.environ.get("SUPERSET_ADMIN", "admin"),
            "--firstname", "Admin", "--lastname", "User", "--email", "admin@local",
            "--password", os.environ.get("SUPERSET_PASSWORD", "admin")], check=False)
        subprocess.run([bin + "/superset", "init"], check=True)
        os.execv(bin + "/gunicorn", ["gunicorn", "-w", "1", "-k", "gthread",
            "--threads", "4", "--timeout", "120", "-b", "0.0.0.0:8088",
            "superset.app:create_app()"])
    expose:
      - "8088"
    ports:
      - "127.0.0.1:${SUPERSET_HOST_PORT:-4504}:8088"
    volumes:
      # SUPERSET_HOME: config, cache and the folder-per-project exports below.
      # Metadata (dashboards, connections, users) lives in the shared postgres
      # (lds_superset); the legacy SQLite file may still sit on this bind mount
      # but is no longer read. Host dir must be writable by UID 65532 (DHI
      # nonroot) — `chown 65532:65532 data/superset` on Linux if writes fail.
      - ${SUPERSET_HOME:-./data/superset}:/app/superset_home
      # Folder-per-project: each subfolder in SUPERSET_PROJECTS_PATH is a dashboard
      # project (YAML exports of dashboards, charts, datasets, databases). Registered
      # automatically via superset-register on lds up (see scripts/run/superset-register.*).
      - ${SUPERSET_PROJECTS_PATH:-./data/superset/projects}:${SUPERSET_PROJECTS_CONTAINER_PATH:-/app/superset_projects}
    healthcheck:
      # Hardened image ships NEITHER wget NOR curl — use the venv python.
      test:
        [
          "CMD-SHELL",
          "/app/.venv/bin/python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8088/health', timeout=4).status==200 else 1)\" || exit 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s
    mem_limit: ${SUPERSET_MEM_LIMIT:-2g}
    networks: [lds-network]

  # Metabase — self-hosted BI dashboards, the simpler alternative to Superset.
  # (profile: metabase, all)
  # Official upstream image (AGPL-3.0) — no DHI variant exists. No default
  # login: the first visit opens Metabase's setup wizard, which creates your
  # admin account. App metadata (questions/dashboards/users/settings) lives in
  # Metabase's embedded H2 file DB at MB_DB_FILE — under the bind-mounted
  # METABASE_DATA dir, so it survives down/up. After setup, add the stack DBs
  # as data sources (e.g. postgresql://app:app@postgres:5432/app).
  metabase:
    image: metabase/metabase:${METABASE_VERSION:-v0.63.19.x}
    container_name: lds-metabase
    profiles: [metabase, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${METABASE_HOST:-metabase.test}
      VIRTUAL_PORT: "3000"
      CERT_NAME: _.test
      # App DB = shared postgres (lds_metabase, created by POSTGRES_INIT_SPECS);
      # Metabase runs its own schema migrations against it on first boot.
      # (H2 fallback: set MB_DB_TYPE=h2 + MB_DB_FILE for a file DB instead.)
      MB_DB_TYPE: postgres
      MB_DB_CONNECTION_URI: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${METABASE_POSTGRES_DB:-lds_metabase}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${METABASE_HOST_PORT:-4541}:3000"
    volumes:
      # App DB is the shared postgres now — this mount only holds the legacy
      # H2 file (and backs the MB_DB_TYPE=h2 fallback mentioned above).
      - ${METABASE_DATA:-./data/metabase}:/metabase-data
    healthcheck:
      # Alpine image ships curl; /api/health answers 200 once ready. Metabase
      # boots slowly (JVM + migrations), hence the long start period.
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:3000/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 120s
    mem_limit: ${METABASE_MEM_LIMIT:-2g}
    networks: [lds-network]

  # ===========================================================================
  # Analytical query engines — DuckDB + Trino (profiles: duckdb | trino, all)
  #   duckdb : embedded OLAP engine — official CLI image. Query Parquet, CSV,
  #            JSON, and Arrow files directly. Use via docker exec.
  #   trino  : full distributed SQL query engine. Federated queries across MySQL,
  #            Postgres, Kafka, and Parquet (via Hive Metastore). Built-in web UI
  #            at :4451/ui. TPCH/TPCDS sample data included for testing.
  #   hive-metastore : Hive Metastore (apache/hive:4.0.0 official image) backing
  #                    Trino's Hive connector. Stores schemas in LDS Postgres.
  # All OFF by default. Trino requires postgres for the Hive Metastore.
  # ===========================================================================
  # DuckDB — embedded analytical SQL engine, persistent file-based.  (profile: duckdb, all)
  # No REST API, no network port. DuckDB is an embedded database (like SQLite).
  # The data.duckdb file lives on a persistent named volume shared with DBX
  # so the GUI can query the same database.
  #   docker exec -it lds-duckdb duckdb /data/data.duckdb
  #   docker exec lds-duckdb duckdb -c "SELECT * FROM read_parquet('/data/sales.parquet')" /data/data.duckdb
  duckdb:
    build:
      context: configs/duckdb
      dockerfile: Dockerfile
      args:
        DUCKDB_VERSION: ${DUCKDB_VERSION:-1.2.0}
    image: ${REGISTRY:-local}/local-dev-stack/duckdb:latest
    container_name: lds-duckdb
    profiles: [duckdb, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - duckdb-data:/data
    mem_limit: ${DUCKDB_MEM_LIMIT:-256m}
    networks: [lds-network]

  # Trino — distributed SQL query engine.  (profile: trino, all)
  trino:
    image: trinodb/trino:${TRINO_VERSION:-latest}
    container_name: lds-trino
    profiles: [trino, all]
    restart: *restart
    <<: *dns
    depends_on:
      hive-metastore:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${TRINO_HOST_PORT:-4451}:8080"
    volumes:
      - ./configs/trino/config.properties:/etc/trino/config.properties:ro
      - ./configs/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./configs/trino/catalog:/etc/trino/catalog:ro
      - ./data/trino:/data/trino
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: ${TRINO_MEM_LIMIT:-2g}
    networks: [lds-network]

  # Hive Metastore — catalog service for Trino's Hive connector.  (profile: trino, all)
  # Uses the official apache/hive image directly. Initialises schema on first
  # startup (idempotent). Backed by LDS Postgres (lds_hive_metastore database).
  # The DB is created by hive-metastore-init (auto-run after compose up for the
  # trino profile). Retries schematool to bridge the race until that DB exists.
  hive-metastore:
    image: apache/hive:4.2.1
    container_name: lds-hive-metastore
    profiles: [trino, all]
    restart: *restart
    <<: *dns
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          if exec 3<>/dev/tcp/postgres/5432 2>/dev/null; then exec 3>&-; break; fi;
          if [ "$$i" = "30" ]; then echo 'postgres not reachable'; exit 1; fi;
          sleep 2;
        done;
        for i in $$(seq 1 24); do
          if /opt/hive/bin/schematool -dbType postgres -initOrUpgradeSchema 2>&1; then
            break;
          fi;
          if [ "$$i" = "24" ]; then
            echo 'schematool failed after 24 retries';
            exit 1;
          fi;
          echo "schematool failed (attempt $$i/24) — retrying in 5s...";
          sleep 5;
        done;
        exec /opt/hive/bin/hive --service metastore
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    expose:
      - "9083"
    volumes:
      - ./configs/hive-metastore/metastore-site.xml:/opt/hive/conf/metastore-site.xml:ro
      - ./configs/hive-metastore/metastore-log4j2.properties:/opt/hive/conf/hive-log4j2.properties:ro
      # PostgreSQL JDBC driver for the metastore's metadata database.
      - ./assets/jdbc/${HIVE_METASTORE_POSTGRES_DRIVER:-postgresql-42.7.4.jar}:/opt/hive/lib/${HIVE_METASTORE_POSTGRES_DRIVER:-postgresql-42.7.4.jar}:ro
      - ./data/trino:/data/trino
    mem_limit: ${HIVE_METASTORE_MEM_LIMIT:-512m}
    networks: [lds-network]

  # ===========================================================================
  # Code quality — static analysis (SAST).  (profiles: semgrep | semgrep-scan)
  #   semgrep      : the VIEWER — a tiny nginx serving the SARIF report + UI at
  #                  semgrep.test. Long-running; this is what `lds up semgrep` starts.
  #   semgrep-scan : the SCANNER — the real semgrep/semgrep CLI image, pinned and
  #                  declared here so it's versioned + pre-pullable as part of the
  #                  stack. It is a ONE-SHOT (runs, writes report.sarif, exits), so
  #                  it lives in its OWN profile and is NOT in `all` — it never
  #                  auto-starts on `lds up` (which would leave an Exited container,
  #                  like the old kafka-init). Invoke it via `lds tools semgrep
  #                  [path]`, which runs `docker compose run --rm semgrep-scan`.
  # ===========================================================================
  semgrep:
    image: lds/nginx:${NGINX_VERSION:-1.27}
    container_name: lds-semgrep
    profiles: [semgrep, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${SEMGREP_HOST:-semgrep.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${SEMGREP_HOST_PORT:-4505}:8080"
    volumes:
      - ./data/semgrep/reports:/usr/share/nginx/html
      - ./configs/semgrep/reports/index.html:/usr/share/nginx/html/index.html:ro
      - ./configs/semgrep/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: ${SEMGREP_MEM_LIMIT:-64m}
    networks: [lds-network]

  # Semgrep scanner (one-shot, run-only — see the note above). `lds tools semgrep
  # [path]` adds `-v <path>:/src -w /src` and the scan args at run time; this
  # service fixes the image + the /out mount (the viewer's report dir).
  semgrep-scan:
    image: ${SEMGREP_IMAGE:-semgrep/semgrep}:${SEMGREP_VERSION:-1.167.0}
    profiles: [semgrep-scan]
    environment:
      # `lds tools semgrep` passes --metrics off by default (SEMGREP_RULES=auto
      # is the only opt-in); pin the CLI's own telemetry env too so a direct
      # `compose run` never uploads project metadata to semgrep.dev.
      SEMGREP_SEND_METRICS: "off"
    volumes:
      - ./data/semgrep/reports:/out
    networks: [lds-network]

  # ===========================================================================
  # Vulnerability scanning — DAST + CVE.  (profiles: zap | trivy | trivy-scan)
  #   zap       : OWASP ZAP — Dynamic Application Security Testing. The full ZAP
  #               desktop UI in the browser (WebSwing) at zap.test. Scans your
  #               RUNNING *.test apps for OWASP Top 10 issues. Long-running.
  #   trivy     : Aqua Trivy — CVE scanning (SCA) of containers, filesystems,
  #               git repos + dependency manifests. The VIEWER (tiny nginx)
  #               serves the HTML report at trivy.test, like the semgrep viewer.
  #   trivy-scan: the one-shot aquasec/trivy CLI, run via `lds tools trivy`.
  # All off by default (LDS_ENABLE_ZAP / LDS_ENABLE_TRIVY in .env).
  # ===========================================================================
  # OWASP ZAP — DAST scanner.  (profile: zap, all)
  # Runs the ZAP desktop UI in the browser via WebSwing (`zap-webswing.sh`):
  # the UI serves on :8080 (zap.test / :4510) and ZAP itself listens on :8090
  # (the proxy/API port, also exposed as :4512). ZAP starts lazily when you open
  # the UI. To scan a local app, ZAP must resolve *.test -> the edge proxy: this
  # service uses the dns container's IN-NETWORK DNS view (10.99.0.53 on
  # lds-dnsnet), which answers *.test with the proxy container IP and forwards
  # everything else to Docker's embedded DNS (127.0.0.11 — also listed as a
  # fallback so zap keeps resolving when the dns container is down).
  # NOTE: the dns container (and the proxy that routes zap.test + serves as the
  # scan gateway) ships with the `proxy`/`php` profiles — start ZAP with
  # `lds up proxy zap` (or `php zap`), not `lds up zap` alone.
  # /zap/wrk is where ZAP exports its root CA (for browser proxying) + reports.
  zap:
    image: ghcr.io/zaproxy/zaproxy:${ZAP_VERSION:-stable}
    container_name: lds-zap
    profiles: [zap, all]
    restart: *restart
    <<: *dns
    user: "zap"
    command: ["zap-webswing.sh"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${ZAP_HOST:-zap.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
      - "8090"
    ports:
      - "127.0.0.1:${ZAP_HOST_PORT:-4510}:8080"       # WebSwing UI
      - "127.0.0.1:${ZAP_PROXY_HOST_PORT:-4512}:8090" # ZAP proxy / API
    volumes:
      - ./data/zap/wrk:/zap/wrk
      - ./data/zap/home:/home/zap
    healthcheck:
      # WebSwing's HTTP server — bash /dev/tcp (the image has no curl/wget).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: ${ZAP_MEM_LIMIT:-2g}
    networks:
      - lds-network
      - lds-dnsnet
    dns:
      - 10.99.0.53
      - 127.0.0.11

  # Trivy — CVE / dependency scanner.  (profile: trivy, all)
  # The VIEWER: a tiny nginx serving data/trivy/reports/ (the HTML report
  # written by `lds tools trivy`) at trivy.test — same pattern as the semgrep
  # viewer.
  trivy:
    image: lds/nginx:${NGINX_VERSION:-1.27}
    container_name: lds-trivy
    profiles: [trivy, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${TRIVY_HOST:-trivy.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${TRIVY_HOST_PORT:-4511}:8080"
    volumes:
      - ./data/trivy/reports:/usr/share/nginx/html
      - ./configs/trivy/reports/index.html:/usr/share/nginx/html/index.html:ro
      - ./configs/trivy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: ${TRIVY_MEM_LIMIT:-64m}
    networks: [lds-network]

  # Trivy scanner (one-shot, run-only — like semgrep-scan). `lds tools trivy`
  # adds `-v <path>:/src` / the docker socket etc. at run time; this service
  # pins the image and mounts the report dir + the vulnerability-DB cache
  # (data/trivy/cache) so the DB downloads once, not on every scan.
  trivy-scan:
    image: ${TRIVY_IMAGE:-aquasec/trivy}:${TRIVY_VERSION:-0.58.1}
    profiles: [trivy-scan]
    volumes:
      - ./data/trivy/reports:/out
      - ./data/trivy/cache:/root/.cache/trivy
    networks: [lds-network]

  # ===========================================================================
  # Code intelligence — code-review-graph.  (profile: crg, all)
  #   crg : AI code-intelligence graph (Tree-sitter -> SQLite) that powers
  #         blast-radius reviews for Claude Code / Codex / Cursor etc. via MCP
  #         (the AI integration is built in — no external service needed). This
  #         service is the VIEWER — a tiny nginx serving the interactive D3
  #         graph HTML exports at crg.test (same pattern as the semgrep/trivy
  #         viewers). The scanner is a locally-built image (configs/crg/
  #         Dockerfile) invoked via `lds tools crg <path>`; it builds the graph
  #         inside the target repo (.code-review-graph/) and exports the HTML
  #         report to data/crg/reports/<name>/.
  # ===========================================================================
  crg:
    image: lds/nginx:${NGINX_VERSION:-1.27}
    container_name: lds-crg
    profiles: [crg, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${CRG_HOST:-crg.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${CRG_HOST_PORT:-4530}:8080"
    volumes:
      - ./data/crg/reports:/usr/share/nginx/html
      - ./configs/crg/reports/index.html:/usr/share/nginx/html/index.html:ro
      - ./configs/crg/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: ${CRG_MEM_LIMIT:-64m}
    networks: [lds-network]

  # ===========================================================================
  # API tooling & project management  (profiles: hoppscotch | plane, all)
  #   hoppscotch : self-hosted API client / Postman alternative (REST, GraphQL,
  #                WebSocket, SSE, MQTT) — Community Edition, MIT. ONE AIO
  #                container (app + admin + backend behind Caddy, subpath
  #                mode); app DB = shared postgres (lds_hoppscotch).
  #   plane      : open-source project management, Jira/Linear alternative —
  #                AGPL-3.0 Community Edition, vendor CE stack (frontend,
  #                instance admin, API, celery worker/beat, one-shot migrator,
  #                caddy edge; DB/cache/broker/object-storage = SHARED
  #                postgres lds_plane + redis DB 0 + rabbitmq + RustFS
  #                `uploads` bucket).
  #   Both OFF by default (LDS_ENABLE_HOPPSCOTCH / LDS_ENABLE_PLANE).
  # ===========================================================================

  # Hoppscotch — self-hosted API client (Postman alternative).  (profile: hoppscotch, all)
  # AIO image: / = the client, /admin = onboarding & users, /backend =
  # GraphQL/REST — one vhost (ENABLE_SUBPATH_BASED_ACCESS). Data lives in the
  # shared postgres (lds_hoppscotch, created by POSTGRES_INIT_SPECS); the
  # hoppscotch-migrate one-shot runs `prisma migrate deploy` idempotently on
  # every up and the app waits for it (erpnext-configurator pattern).
  # Email magic links go to the stack's Mailpit (profile: mail) — click them in
  # mail.test; OAuth (GitHub/Google/Microsoft) is configured in /admin.
  # HTTPS URLs in VITE_* are intentional: https/wss work from BOTH the http and
  # https origins (mixed-content only blocks http FROM https), and the edge
  # proxy terminates TLS. Flip HOPPSCOTCH_BASE_URL to http:// if you run the
  # stack without LDS_ENABLE_HTTPS.
  hoppscotch:
    image: hoppscotch/hoppscotch:${HOPPSCOTCH_VERSION:-2026.9.0}
    container_name: lds-hoppscotch
    profiles: [hoppscotch, all]
    restart: *restart
    <<: *dns
    depends_on:
      postgres:
        condition: service_healthy
      hoppscotch-migrate:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${HOPPSCOTCH_HOST:-hoppscotch.test}
      VIRTUAL_PORT: "80"
      CERT_NAME: _.test
      ENABLE_SUBPATH_BASED_ACCESS: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${HOPPSCOTCH_POSTGRES_DB:-lds_hoppscotch}
      # 32-char key: encrypts credentials/tokens stored in the app DB.
      DATA_ENCRYPTION_KEY: ${HOPPSCOTCH_DATA_ENCRYPTION_KEY:-lds-hopp-dev-encryption-key-32ch}
      WHITELISTED_ORIGINS: ${HOPPSCOTCH_BASE_URL:-https://hoppscotch.test},http://${HOPPSCOTCH_HOST:-hoppscotch.test},http://localhost:${HOPPSCOTCH_HOST_PORT:-4542}
      VITE_BASE_URL: ${HOPPSCOTCH_BASE_URL:-https://hoppscotch.test}
      VITE_SHORTCODE_BASE_URL: ${HOPPSCOTCH_BASE_URL:-https://hoppscotch.test}
      VITE_ADMIN_URL: ${HOPPSCOTCH_BASE_URL:-https://hoppscotch.test}/admin
      VITE_BACKEND_GQL_URL: ${HOPPSCOTCH_BASE_URL:-https://hoppscotch.test}/backend/graphql
      VITE_BACKEND_WS_URL: ${HOPPSCOTCH_WS_URL:-wss://hoppscotch.test}/backend/graphql
      VITE_BACKEND_API_URL: ${HOPPSCOTCH_BASE_URL:-https://hoppscotch.test}/backend/v1
      # Providers selectable in the /admin onboarding; EMAIL = magic link via
      # Mailpit (SMTP below, needs the `mail` profile). Add OAuth client IDs in
      # /admin to enable GitHub/Google/Microsoft.
      VITE_ALLOWED_AUTH_PROVIDERS: ${HOPPSCOTCH_AUTH_PROVIDERS:-EMAIL}
      MAILER_USE_CUSTOM_CONFIGS: "true"
      SMTP_HOST: ${HOPPSCOTCH_SMTP_HOST:-mail}
      SMTP_PORT: ${HOPPSCOTCH_SMTP_PORT:-1025}
      SMTP_FROM_ADDRESS: ${HOPPSCOTCH_SMTP_FROM:-hoppscotch@lds.test}
    expose:
      - "80"
    ports:
      - "127.0.0.1:${HOPPSCOTCH_HOST_PORT:-4542}:80"
    healthcheck:
      # AIO ships busybox-style wget (Caddy base); / answers 200 once up.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${HOPPSCOTCH_MEM_LIMIT:-1g}
    networks: [lds-network]

  # One-shot: Prisma migrations for the Hoppscotch app DB. Idempotent, re-runs
  # on every `up` and exits 0; `hoppscotch` waits on it via
  # service_completed_successfully (same pattern as erpnext-configurator).
  hoppscotch-migrate:
    image: hoppscotch/hoppscotch:${HOPPSCOTCH_VERSION:-2026.9.0}
    container_name: lds-hoppscotch-migrate
    profiles: [hoppscotch, all]
    restart: "no"
    <<: *dns
    entrypoint: ["/bin/sh", "-c"]
    command:
      - pnpm exec prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${HOPPSCOTCH_POSTGRES_DB:-lds_hoppscotch}
      DATA_ENCRYPTION_KEY: ${HOPPSCOTCH_DATA_ENCRYPTION_KEY:-lds-hopp-dev-encryption-key-32ch}
    networks: [lds-network]

  # --- Plane Community Edition (profile: plane, all) — vendor CE stack -------
  # Adapted from deployments/cli/community/docker-compose.yml:
  #   - `deploy:` blocks (Swarm-only, inert under plain compose) replaced by
  #     LDS restart/mem conventions; one-shot migrator gets restart: "no".
  #   - service key `proxy` renamed `plane-proxy` — the bare alias `proxy` on
  #     lds-network belongs to the LDS edge router (nginx-proxy).
  #   - DB/cache/broker/object-storage moved to the SHARED stack services:
  #     dedicated lds_plane database on the shared postgres
  #     (POSTGRES_INIT_SPECS), shared redis (logical DB 0), shared RabbitMQ
  #     (rabbitmq), RustFS S3 API (`uploads` bucket).
  #   - only the HTTP listener is published (127.0.0.1:4543); TLS terminates at
  #     the LDS edge proxy, which routes plane.test -> plane-proxy:80.
  web:
    image: makeplane/plane-frontend:${APP_RELEASE:-stable}
    container_name: lds-plane-web
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    depends_on:
      - api
      - worker
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    mem_limit: ${PLANE_WEB_MEM_LIMIT:-512m}
    networks: [lds-network]

  space:
    image: makeplane/plane-space:${APP_RELEASE:-stable}
    container_name: lds-plane-space
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    depends_on:
      - api
      - worker
      - web
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    mem_limit: ${PLANE_SPACE_MEM_LIMIT:-512m}
    networks: [lds-network]

  admin:
    image: makeplane/plane-admin:${APP_RELEASE:-stable}
    container_name: lds-plane-admin
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    depends_on:
      - api
      - web
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    mem_limit: ${PLANE_ADMIN_MEM_LIMIT:-512m}
    networks: [lds-network]

  live:
    image: makeplane/plane-live:${APP_RELEASE:-stable}
    container_name: lds-plane-live
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    depends_on:
      - api
      - web
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      <<: [*live-env, *redis-env]
    mem_limit: ${PLANE_LIVE_MEM_LIMIT:-512m}
    networks: [lds-network]

  api:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    container_name: lds-plane-api
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    command: ./bin/docker-entrypoint-api.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_started
      # Django must only boot AFTER the schema exists (erpnext-style ordering).
      migrator:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_api:/code/plane/logs
    healthcheck:
      # Django image ships python3 — gunicorn listens on :8000 (API_BASE_URL).
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',8000),5)\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: ${PLANE_API_MEM_LIMIT:-1g}
    networks: [lds-network]

  worker:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    container_name: lds-plane-worker
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    command: ./bin/docker-entrypoint-worker.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_worker:/code/plane/logs
    # Celery worker listens on no TCP port — health = process alive (restart policy).
    mem_limit: ${PLANE_WORKER_MEM_LIMIT:-1g}
    networks: [lds-network]

  beat-worker:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    container_name: lds-plane-beat-worker
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    command: ./bin/docker-entrypoint-beat.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_beat-worker:/code/plane/logs
    # Celery beat — scheduler, no TCP port (same note as worker).
    mem_limit: ${PLANE_BEAT_MEM_LIMIT:-512m}
    networks: [lds-network]

  # One-shot Django migrations — idempotent, re-runs on every `up` (exit 0);
  # api/worker/beat wait for it (service_completed_successfully). LDS deletes
  # the exited container right after a successful `up` (up.sh/up.bat cleanup
  # hook) so it never lingers in `ps`; the next `up plane` re-runs it.
  # On failure it is kept for `docker logs lds-plane-migrator`.
  migrator:
    image: makeplane/plane-backend:${APP_RELEASE:-stable}
    container_name: lds-plane-migrator
    profiles: [plane, all]
    restart: "no"
    <<: *dns
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *proxy-env]
    volumes:
      - logs_migrator:/code/plane/logs
    mem_limit: ${PLANE_MIGRATOR_MEM_LIMIT:-512m}
    networks: [lds-network]

  # NOTE: plane-db (Postgres 15.7), plane-redis (Valkey), plane-minio and
  # the dedicated plane-mq broker were dropped — Plane now runs on the SHARED
  # stack services: postgres (lds_plane DB via POSTGRES_INIT_SPECS), redis
  # (logical DB 0), RustFS (S3 API, `uploads` bucket) and the RabbitMQ broker
  # (service rabbitmq, profiles rabbitmq/plane/all — see the RabbitMQ block
  # above the Admin tools section).

  # Plane's own caddy edge (service key renamed from vendor `proxy` — see the
  # section header). Holds VIRTUAL_HOST so the LDS edge proxy routes
  # plane.test here; also published loopback-only for direct localhost:4543.
  plane-proxy:
    image: makeplane/plane-proxy:${APP_RELEASE:-stable}
    container_name: lds-plane-proxy
    profiles: [plane, all]
    restart: *restart
    <<: *dns
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${PLANE_HOST:-plane.test}
      VIRTUAL_PORT: "80"
      CERT_NAME: _.test
      <<: *proxy-env
    expose:
      - "80"
    ports:
      - "127.0.0.1:${PLANE_HOST_PORT:-4543}:80"
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    mem_limit: ${PLANE_PROXY_MEM_LIMIT:-128m}
    networks: [lds-network]

  # ===========================================================================
  # Web utilities — converters, diagramming, directories & monitoring.
  #   (profiles: snapotter | imgcompress | drawio | lldap | openldap |
  #    monitoring, all)
  #     snapotter : file-processing platform (convert/compress/OCR/AI, 300+
  #                 tools) — shares the stack's postgres + redis.
  #     imgcompress: image toolbox — 70+ formats, bulk compress, image->PDF,
  #                 local AI background removal (single hardened container).
  #     drawio     : draw.io diagrams, self-contained (no cloud storage).
  #     lldap      : lightweight LDAP directory — auth backend for your apps.
  #                 Web UI disabled (raw LDAP :4537 only) — manage it with
  #                 DBX's LDAP Studio plugin.
  #     openldap   : full OpenLDAP (slapd) directory — no web UI at all, same
  #                 base DN/credentials idiom as lldap; manage via DBX too.
  #     monitoring : Prometheus (metrics TSDB) + Grafana (dashboards) in ONE
  #                  profile — they only make sense together. Off by default.
  # ===========================================================================
  # SnapOtter — file-processing platform (images/video/audio/PDF/docs, AI
  # tools). Shares the stack's postgres (lds_snapotter DB, auto-created via
  # POSTGRES_INIT_SPECS) + redis (logical DB 7, BullMQ queues) — same idiom
  # as Analytics/Tasks/Wiki. No login by default (AUTH_ENABLED=false, every
  # request is admin on the trusted local network; flip SNAPOTTER_AUTH_ENABLED
  # for admin/admin login). Files + AI models bind-mounted to data/snapotter;
  # /tmp/workspace (processing scratch) is an ephemeral named volume.
  snapotter:
    image: ${SNAPOTTER_IMAGE:-snapotter/snapotter}:${SNAPOTTER_VERSION:-2.2.0}
    container_name: lds-snapotter
    profiles: [snapotter, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${SNAPOTTER_HOST:-snapotter.test}
      VIRTUAL_PORT: "1349"
      CERT_NAME: _.test
      PORT: "1349"
      # Fail fast if DATABASE_URL/REDIS_URL are missing (no embedded PG/Redis).
      EMBEDDED: "0"
      AUTH_ENABLED: ${SNAPOTTER_AUTH_ENABLED:-false}
      DEFAULT_USERNAME: ${SNAPOTTER_DEFAULT_USERNAME:-admin}
      DEFAULT_PASSWORD: ${SNAPOTTER_DEFAULT_PASSWORD:-admin}
      SKIP_MUST_CHANGE_PASSWORD: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${SNAPOTTER_POSTGRES_DB:-lds_snapotter}
      REDIS_URL: redis://redis:6379/${SNAPOTTER_REDIS_DB:-7}
      CORS_ORIGIN: http://${SNAPOTTER_HOST:-snapotter.test},https://${SNAPOTTER_HOST:-snapotter.test},http://localhost:${SNAPOTTER_HOST_PORT:-4538}
      MAX_UPLOAD_SIZE_MB: ${SNAPOTTER_MAX_UPLOAD_SIZE_MB:-200}
      FILE_MAX_AGE_HOURS: ${SNAPOTTER_FILE_MAX_AGE_HOURS:-72}
      # Kill ALL telemetry egress (PostHog + Sentry, API and browser SDK):
      # /api/v1/config/analytics then reports disabled and nothing leaves the
      # machine. The published image ships it on; set 1 to opt in.
      SNAPOTTER_TELEMETRY: ${SNAPOTTER_TELEMETRY:-0}
    expose:
      - "1349"
    ports:
      - "127.0.0.1:${SNAPOTTER_HOST_PORT:-4538}:1349"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/snapotter:/data
      - snapotter-workspace:/tmp/workspace
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:1349/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${SNAPOTTER_MEM_LIMIT:-1024m}
    networks: [lds-network]

  # ImgCompress — image toolbox (70+ formats, bulk compression, image->PDF,
  # local AI background removal). Single hardened container (DHI base, nonroot,
  # no shell) — its baked-in python healthcheck is reused here. Stateless from
  # the stack's point of view (files live inside the container, no volume).
  imgcompress:
    image: ${IMGCOMPRESS_IMAGE:-karimz1/imgcompress}:${IMGCOMPRESS_VERSION:-0.9.0}
    container_name: lds-imgcompress
    profiles: [imgcompress, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${IMGCOMPRESS_HOST:-imgcompress.test}
      VIRTUAL_PORT: "5000"
      CERT_NAME: _.test
      DISABLE_LOGO: ${IMGCOMPRESS_DISABLE_LOGO:-false}
      DISABLE_STORAGE_MANAGEMENT: ${IMGCOMPRESS_DISABLE_STORAGE_MANAGEMENT:-false}
    expose:
      - "5000"
    ports:
      - "127.0.0.1:${IMGCOMPRESS_HOST_PORT:-4539}:5000"
    healthcheck:
      test: ["CMD", "python", "/container/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: ${IMGCOMPRESS_MEM_LIMIT:-1024m}
    networks: [lds-network]

  # draw.io — self-hosted diagramming on Tomcat. `?offline=1&https=0` (in the
  # dashboard link / URL) disables cloud storage, so diagrams stay local (and
  # Export as > PDF works via the browser print dialog, no export server).
  drawio:
    image: ${DRAWIO_IMAGE:-jgraph/drawio}:${DRAWIO_VERSION:-31.6.1}
    container_name: lds-drawio
    profiles: [drawio, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${DRAWIO_HOST:-drawio.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${DRAWIO_HOST_PORT:-4535}:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: ${DRAWIO_MEM_LIMIT:-768m}
    networks: [lds-network]

  # LLDAP — lightweight LDAP (Rust), SQLite on disk. RAW LDAP only: the web UI
  # is deliberately NOT exposed (no VIRTUAL_HOST, no host port) — manage
  # entries through DBX's LDAP Studio plugin instead. Host LDAP (:4537) /
  # in-network lldap:3890; internal :17170 stays up for the dashboard's
  # reachability probe. Login DN: cn=admin,ou=people,<base> / LLDAP_ADMIN_PASSWORD.
  lldap:
    image: ${LLDAP_IMAGE:-lldap/lldap}:${LLDAP_VERSION:-2026-09-22}
    container_name: lds-lldap
    profiles: [lldap, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:-lds-dev-jwt-secret-change-me}
      LLDAP_KEY_SEED: ${LLDAP_KEY_SEED:-lds-dev-key-seed-change-me}
      LLDAP_LDAP_BASE_DN: ${LLDAP_BASE_DN:-dc=lds,dc=test}
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD:-admin}
      LLDAP_HTTP_URL: http://lldap:17170
    expose:
      - "17170"
      - "3890"
    ports:
      - "127.0.0.1:${LLDAP_LDAP_HOST_PORT:-4537}:3890"
    volumes:
      - ./data/lldap:/data
    healthcheck:
      # No HTTP client in the image — plain TCP check on the UI port.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/17170'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: ${LLDAP_MEM_LIMIT:-128m}
    networks: [lds-network]

  # OpenLDAP (slapd) — the classic full directory. NO web UI by design: raw
  # LDAP on :4540 (host) / openldap:389 (in-network), managed through DBX's
  # LDAP Studio plugin. Built FROM Docker Hardened Images' Alpine line by
  # cleanstart (Verified Publisher, OLDAP-2.8) — DHI ships no openldap product.
  # The stock entrypoint is bare `slapd`, so configs/openldap/entrypoint.sh
  # does the first-boot work (slapd.conf from env, slapadd base entries) and
  # then execs slapd as the unprivileged ldap user. Same base DN + admin
  # password idiom as LLDAP, so apps can swap between the two backends.
  openldap:
    image: ${OPENLDAP_IMAGE:-cleanstart/openldap}:${OPENLDAP_VERSION:-2.7.1-dev}
    container_name: lds-openldap
    profiles: [openldap, all]
    restart: *restart
    <<: *dns
    entrypoint: ["/bin/sh", "/lds/entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      OPENLDAP_BASE_DN: ${OPENLDAP_BASE_DN:-dc=lds,dc=test}
      # Empty = entrypoint derives cn=admin,<base> from OPENLDAP_BASE_DN.
      OPENLDAP_ADMIN_DN: ${OPENLDAP_ADMIN_DN:-}
      OPENLDAP_ADMIN_PASSWORD: ${OPENLDAP_ADMIN_PASSWORD:-adminadmin}
    expose:
      - "389"
    ports:
      - "127.0.0.1:${OPENLDAP_HOST_PORT:-4540}:389"
    volumes:
      - ./configs/openldap/entrypoint.sh:/lds/entrypoint.sh:ro
      - ./configs/openldap/slapd.conf.tmpl:/lds/slapd.conf.tmpl:ro
      - ./configs/openldap/bootstrap.ldif.tmpl:/lds/bootstrap.ldif.tmpl:ro
      - ./data/openldap:/var/lib/openldap
    healthcheck:
      # Real LDAP probe — the -dev image ships openldap-clients (ldapsearch).
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -b '' -s base 1.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    # This slapd build keeps ~750 MB RSS even on an empty directory (the stock
    # image behaves the same), so the cap needs real headroom.
    mem_limit: ${OPENLDAP_MEM_LIMIT:-1g}
    networks: [lds-network]

  # Prometheus — pull-based metrics TSDB. Scrapes itself + Grafana out of the
  # box; add your services' /metrics endpoints in configs/prometheus/
  # prometheus.yml (bind-mounted read-only). Data in a named volume (TSDB is
  # disposable — `down -v` wipes it, like the DBs).
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus}:${PROMETHEUS_VERSION:-v3.13.4}
    container_name: lds-prometheus
    profiles: [monitoring, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${PROMETHEUS_HOST:-prometheus.test}
      VIRTUAL_PORT: "9090"
      CERT_NAME: _.test
    expose:
      - "9090"
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-4533}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:9090/-/healthy' >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    networks: [lds-network]

  # Grafana — dashboards/alerting with the Prometheus datasource pre-wired by
  # provisioning (configs/grafana/provisioning). Anonymous Admin by default
  # (no login; GRAFANA_ANONYMOUS=false restores admin/GRAFANA_ADMIN_* login);
  # SQLite + plugins in the grafana-data volume — DB-backed, not user files).
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana}:${GRAFANA_VERSION:-13.0.10}
    container_name: lds-grafana
    profiles: [monitoring, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${GRAFANA_HOST:-grafana.test}
      VIRTUAL_PORT: "3000"
      CERT_NAME: _.test
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ROLE:-Admin}
      # No phone-home: skip grafana.org version checks + usage reporting.
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-4532}:3000"
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:3000/api/health' >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: ${GRAFANA_MEM_LIMIT:-384m}
    networks: [lds-network]

  # ===========================================================================
  # LDS Apps — custom-built tooling (profiles: analytics | tasks | wiki | all)
  #   Each app has its own API (Hono + Drizzle + PostgreSQL) and UI (different
  #   frontend framework per app). All share the lds-postgres service.
  # ===========================================================================

  # --- LDS Analytics (profile: analytics, all) — Nuxt/Vue reactive dashboard ---
  analytics-api:
    build:
      context: configs/analytics/api
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/analytics-api:latest
    container_name: lds-analytics-api
    profiles: [analytics, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "3001"
      DATABASE_URL: postgresql://${ANALYTICS_POSTGRES_USER:-app}:${ANALYTICS_POSTGRES_PASSWORD:-app}@postgres:5432/${ANALYTICS_POSTGRES_DB:-lds_analytics}
      CORS_ORIGIN: ${ANALYTICS_CORS_ORIGIN:-http://localhost:4173,http://lds-analytics.test,https://lds-analytics.test}
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${ANALYTICS_API_HOST_PORT:-4520}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: ${ANALYTICS_API_MEM_LIMIT:-384m}
    networks: [lds-network]

  analytics-ui:
    build:
      context: configs/analytics/ui
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/analytics-ui:latest
    container_name: lds-analytics-ui
    profiles: [analytics, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${ANALYTICS_HOST:-lds-analytics.test}
      CERT_NAME: _.test
      API_URL: http://analytics-api:3001
    expose:
      - "4173"
    ports:
      - "127.0.0.1:${ANALYTICS_HOST_PORT:-4521}:4173"
    depends_on:
      analytics-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4173 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${ANALYTICS_UI_MEM_LIMIT:-192m}
    networks: [lds-network]

  # --- LDS Tasks (profile: tasks, all) — Angular project management + wiki ---
  tasks-api:
    build:
      context: configs/tasks/api
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/tasks-api:latest
    container_name: lds-tasks-api
    profiles: [tasks, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "3002"
      DATABASE_URL: postgresql://${TASKS_POSTGRES_USER:-app}:${TASKS_POSTGRES_PASSWORD:-app}@postgres:5432/${TASKS_POSTGRES_DB:-lds_tasks}
      CORS_ORIGIN: ${TASKS_CORS_ORIGIN:-http://localhost:4174,http://lds-tasks.test,https://lds-tasks.test}
    expose:
      - "3002"
    ports:
      - "127.0.0.1:${TASKS_API_HOST_PORT:-4522}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: ${TASKS_API_MEM_LIMIT:-384m}
    networks: [lds-network]

  tasks-ui:
    build:
      context: configs/tasks/ui
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/tasks-ui:latest
    container_name: lds-tasks-ui
    profiles: [tasks, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${TASKS_HOST:-lds-tasks.test}
      CERT_NAME: _.test
      API_URL: http://tasks-api:3002
    expose:
      - "4174"
    ports:
      - "127.0.0.1:${TASKS_HOST_PORT:-4523}:4174"
    depends_on:
      tasks-api:
        condition: service_healthy
    # lds/nginx (DHI hardened) has no shell/wget - health verified by proxy
    mem_limit: ${TASKS_UI_MEM_LIMIT:-128m}
    networks: [lds-network]

  # --- LDS Wiki (profile: wiki, all) — Next.js/React documentation hub ---
  wiki-api:
    build:
      context: configs/wiki/api
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/wiki-api:latest
    container_name: lds-wiki-api
    profiles: [wiki, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "3003"
      DATABASE_URL: postgresql://${WIKI_POSTGRES_USER:-app}:${WIKI_POSTGRES_PASSWORD:-app}@postgres:5432/${WIKI_POSTGRES_DB:-lds_wiki}
      CORS_ORIGIN: ${WIKI_CORS_ORIGIN:-http://localhost:4175,http://lds-wiki.test,https://lds-wiki.test}
    expose:
      - "3003"
    ports:
      - "127.0.0.1:${WIKI_API_HOST_PORT:-4524}:3003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: ${WIKI_API_MEM_LIMIT:-256m}
    networks: [lds-network]

  wiki-ui:
    build:
      context: configs/wiki/ui
      dockerfile: Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/wiki-ui:latest
    container_name: lds-wiki-ui
    profiles: [wiki, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${WIKI_HOST:-lds-wiki.test}
      CERT_NAME: _.test
      API_URL: http://wiki-api:3003
    expose:
      - "4175"
    ports:
      - "127.0.0.1:${WIKI_HOST_PORT:-4525}:4175"
    depends_on:
      wiki-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4175 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${WIKI_UI_MEM_LIMIT:-256m}
    networks: [lds-network]

  # ===========================================================================
  # Mailpit — dev SMTP sink + web inbox (Mailchimp alternative for local testing).
  #   profile: mail, all
  #   - Captures outbound SMTP without sending real mail.
  #   - Web inbox at mail.test / localhost:4513.
  # ===========================================================================
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.27}
    container_name: lds-mailpit
    profiles: [mail, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${MAIL_HOST:-mail.test}
      VIRTUAL_PORT: "8025"
      CERT_NAME: _.test
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    expose:
      - "8025"
      - "1025"
    ports:
      - "127.0.0.1:${MAIL_HOST_PORT:-4513}:8025"
      - "127.0.0.1:${MAIL_SMTP_HOST_PORT:-4514}:1025"
    volumes:
      - ./data/mailpit:/data
    mem_limit: ${MAIL_MEM_LIMIT:-256m}
    networks: [lds-network]

  # ===========================================================================
  # Penpot — self-hosted collaborative design tool.
  #   profile: penpot, all
  #   - Frontend UI + backend API + exporter workers.
  #   - Reuses shared postgres + valkey (both included in the penpot profile).
  # ===========================================================================
  penpot-frontend:
    image: penpotapp/frontend:${PENPOT_VERSION:-2.17.0}
    container_name: lds-penpot-frontend
    profiles: [penpot, all]
    restart: *restart
    <<: *dns
    depends_on:
      penpot-backend:
        condition: service_started
      penpot-exporter:
        condition: service_started
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${PENPOT_HOST:-penpot.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
      PENPOT_FLAGS: "${PENPOT_FLAGS:-enable-registration enable-login-with-password disable-email-verification}"
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://penpot.test}
      PENPOT_BACKEND_URI: http://penpot-backend:6060
      PENPOT_EXPORTER_URI: http://penpot-exporter:6061
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${PENPOT_HOST_PORT:-4518}:8080"
    volumes:
      - ./data/penpot/assets:/opt/data/assets
    mem_limit: ${PENPOT_FRONTEND_MEM_LIMIT:-512m}
    networks: [lds-network]

  penpot-backend:
    image: penpotapp/backend:${PENPOT_VERSION:-2.17.0}
    container_name: lds-penpot-backend
    profiles: [penpot, all]
    restart: *restart
    <<: *dns
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PENPOT_FLAGS: "${PENPOT_FLAGS:-enable-registration enable-login-with-password disable-email-verification}"
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://penpot.test}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:-penpot-dev-secret-key-change-me-please}
      PENPOT_DATABASE_URI: ${PENPOT_DATABASE_URI:-postgresql://postgres/${PENPOT_POSTGRES_DB:-lds_penpot}}
      PENPOT_DATABASE_USERNAME: ${PENPOT_POSTGRES_USER:-app}
      PENPOT_DATABASE_PASSWORD: ${PENPOT_POSTGRES_PASSWORD:-app}
      PENPOT_REDIS_URI: redis://valkey:6379/0
      PENPOT_OBJECTS_STORAGE_BACKEND: ${PENPOT_OBJECTS_STORAGE_BACKEND:-fs}
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: ${PENPOT_OBJECTS_STORAGE_FS_DIRECTORY:-/opt/data/assets}
      PENPOT_TELEMETRY_ENABLED: "${PENPOT_TELEMETRY_ENABLED:-false}"
    expose:
      - "6060"
    volumes:
      - ./data/penpot/assets:/opt/data/assets
    mem_limit: ${PENPOT_BACKEND_MEM_LIMIT:-768m}
    networks: [lds-network]

  penpot-exporter:
    image: penpotapp/exporter:${PENPOT_VERSION:-2.17.0}
    container_name: lds-penpot-exporter
    profiles: [penpot, all]
    restart: *restart
    <<: *dns
    depends_on:
      valkey:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:-penpot-dev-secret-key-change-me-please}
      PENPOT_PUBLIC_URI: ${PENPOT_PUBLIC_URI:-http://penpot.test}
      PENPOT_INTERNAL_URI: ${PENPOT_INTERNAL_URI:-http://penpot-frontend:8080}
      PENPOT_REDIS_URI: redis://valkey:6379/0
    expose:
      - "6061"
    mem_limit: ${PENPOT_EXPORTER_MEM_LIMIT:-512m}
    networks: [lds-network]

  # ===========================================================================
  # Vaultwarden — self-hosted password manager (Bitwarden-compatible API/UI).
  #   profile: vaultwarden, all
  #   - Single lightweight container, sqlite-backed by default.
  #   - Reuses the shared edge proxy via VIRTUAL_HOST (when proxy/php profile is up).
  # ===========================================================================
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-1.34.3}
    container_name: lds-vaultwarden
    profiles: [vaultwarden, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      ROCKET_PORT: "80"
      VIRTUAL_HOST: ${VAULTWARDEN_HOST:-vaultwarden.test}
      VIRTUAL_PORT: "80"
      CERT_NAME: _.test
      DOMAIN: ${VAULTWARDEN_DOMAIN:-http://vaultwarden.test}
      SIGNUPS_ALLOWED: "${VAULTWARDEN_SIGNUPS_ALLOWED:-false}"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN:-vaultwarden-dev-admin-token-change-me}
      # Explicitly no outbound calls: HIBP password-check (needs a key anyway)
      # + the Bitwarden push relay stay off.
      ENABLE_HIBP: "false"
      PUSH_ENABLED: "false"
    expose:
      - "80"
    ports:
      - "127.0.0.1:${VAULTWARDEN_HOST_PORT:-4506}:80"
    volumes:
      - vaultwarden-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/alive >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${VAULTWARDEN_MEM_LIMIT:-128m}
    cpus: ${VAULTWARDEN_CPUS:-0.25}
    networks: [lds-network]

  # ===========================================================================
  # Websites & CMS  (profiles: instatic | all)
  #   instatic : self-hosted visual CMS / website builder (Webflow/Framer/WordPress
  #              alternative) — canvas editor + content engine + publisher that
  #              emits clean static HTML/CSS. MIT, official image (one Bun server).
  #              Admin UI at instatic.test/admin; data (SQLite + uploads) lives in
  #              ./data/instatic. Optionally point INSTATIC_DATABASE_URL at the
  #              shared Postgres instead of SQLite. Pre-1.0 (0.0.x) upstream.
  # ===========================================================================
  instatic:
    image: ghcr.io/corebunch/instatic:${INSTATIC_VERSION:-0.0.14}
    container_name: lds-instatic
    profiles: [instatic, all]
    restart: *restart
    <<: *dns
    environment:
      PORT: "3001"
      # SQLite by default (file inside ./data/instatic); switch to the shared
      # Postgres via:  postgres://app:app@postgres:5432/lds_instatic
      DATABASE_URL: ${INSTATIC_DATABASE_URL:-sqlite:/app/data/cms.db}
      UPLOADS_DIR: /app/uploads
      STATIC_DIR: /app/dist
      # Behind the LDS edge proxy — trust the Docker networks it comes from.
      TRUSTED_PROXY_CIDRS: ${INSTATIC_TRUSTED_PROXY_CIDRS:-0.0.0.0/0}
      INSTATIC_SECRET_KEY: ${INSTATIC_SECRET_KEY:-instatic-dev-secret-key-change-me}
      # CSRF origin allowlist: the TLS-terminating edge forwards plain http, so
      # include both schemes + the direct localhost port (browser Origin must
      # match; overridable via INSTATIC_PUBLIC_ORIGIN, comma-separated).
      PUBLIC_ORIGIN: ${INSTATIC_PUBLIC_ORIGIN:-https://${INSTATIC_HOST:-instatic.test},http://${INSTATIC_HOST:-instatic.test},http://localhost:${INSTATIC_HOST_PORT:-4528}}
      VIRTUAL_HOST: ${INSTATIC_HOST:-instatic.test}
      VIRTUAL_PORT: "3001"
      CERT_NAME: _.test
    expose:
      - "3001"
    ports:
      - "127.0.0.1:${INSTATIC_HOST_PORT:-4528}:3001"
    volumes:
      - ./data/instatic/data:/app/data
      - ./data/instatic/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "run", "server/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: ${INSTATIC_MEM_LIMIT:-512m}
    networks: [lds-network]


  # Realtime / pub-sub brokers (profiles: soketi | centrifugo | mqtt, all)
  #   OFF BY DEFAULT — their LDS_ENABLE_* toggles are false. Turn one on explicitly:
  #     lds up soketi      Pusher protocol — Laravel Reverb/Echo compatible
  #     lds up centrifugo  raw WebSocket channels + built-in admin UI
  #     lds up mqtt        MQTT + MQTT-over-WebSocket + dashboard
  #   A "channel"/"topic" is just a name: ONE broker handles unlimited channels,
  #   you never run a second one per channel. Pick the broker whose CLIENT
  #   protocol matches your app — the three speak DIFFERENT protocols over the
  #   WebSocket and are NOT interchangeable on the client side.
  #   All three are STATELESS (no data volume → nothing to grow on disk) and
  #   carry mem/cpu caps so they stay light even when running.
  # ===========================================================================

  # Soketi — Pusher-protocol WebSocket server. Drop-in for Laravel broadcasting
  # (BROADCAST_DRIVER=pusher/reverb) + Laravel Echo / pusher-js on the client:
  # point them at this host/port with the app key/secret below. Headless (no UI).
  soketi:
    image: quay.io/soketi/soketi:${SOKETI_VERSION:-1.6-16-alpine}
    container_name: lds-soketi
    profiles: [soketi, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      SOKETI_DEBUG: "${SOKETI_DEBUG:-0}"
      # Dev-only default app credentials — override in .env for anything shared.
      SOKETI_DEFAULT_APP_ID: ${SOKETI_APP_ID:-app-id}
      SOKETI_DEFAULT_APP_KEY: ${SOKETI_APP_KEY:-app-key}
      SOKETI_DEFAULT_APP_SECRET: ${SOKETI_APP_SECRET:-app-secret}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
      # Reachable at ws.test when the proxy profile is up (WS upgrade is handled).
      VIRTUAL_HOST: ${SOKETI_HOST:-ws.test}
      VIRTUAL_PORT: "6001"
      CERT_NAME: _.test
    expose:
      - "6001"
    ports:
      - "127.0.0.1:${SOKETI_HOST_PORT:-4440}:6001"
    healthcheck:
      # curl-less image — use the bundled node to confirm the port accepts TCP.
      test:
        [
          "CMD-SHELL",
          'node -e "require(''net'').connect(6001,''127.0.0.1'').on(''connect'',()=>process.exit(0)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${SOKETI_MEM_LIMIT:-256m}
    cpus: ${SOKETI_CPUS:-0.50}
    networks: [lds-network]

  # Centrifugo — language-agnostic real-time server (raw WebSocket + SSE).
  # Clients use the Centrifuge JS SDK (NOT Laravel Echo). Ships an admin UI at
  # http://centrifugo.test (or :4431). Runs in dev "insecure" mode so you can
  # publish/subscribe without minting JWTs; flip the flags off for auth.
  centrifugo:
    image: centrifugo/centrifugo:${CENTRIFUGO_VERSION:-v5}
    container_name: lds-centrifugo
    profiles: [centrifugo, all]
    restart: *restart
    <<: *dns
    command: centrifugo --admin --admin_insecure --client_insecure --api_insecure --health
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-*}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET_KEY:-token-secret}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-admin}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-admin-secret}
      VIRTUAL_HOST: ${CENTRIFUGO_HOST:-centrifugo.test}
      VIRTUAL_PORT: "8000"
      CERT_NAME: _.test
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${CENTRIFUGO_HOST_PORT:-4441}:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -nv -t1 --spider http://127.0.0.1:8000/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${CENTRIFUGO_MEM_LIMIT:-256m}
    cpus: ${CENTRIFUGO_CPUS:-0.50}
    networks: [lds-network]

  # MQTT — Eclipse Mosquitto broker + MQTTX Web client. (profile: mqtt, all)
  # Replaces EMQX: lightweight, fully anonymous, and the web UI needs NO login.
  # MQTT->Kafka is NOT a broker feature here (EMQX's Kafka bridge is Enterprise-
  # only anyway) — it's done in the generic Kafka Connect worker via the Stream
  # Reactor MQTT connector (`lds kafka connect-plugin --generic <mqtt-url>`), which
  # subscribes to the broker (mosquitto:1883) and produces to Kafka. See
  # docs/en/15-data-tools.md.
  mosquitto:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2.0.22}
    container_name: lds-mosquitto
    profiles: [mqtt, all]
    restart: *restart
    <<: *dns
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    ports:
      - "127.0.0.1:${MQTT_HOST_PORT:-4442}:1883" # native MQTT (backends/devices, in-net: mosquitto:1883)
      - "127.0.0.1:${MQTT_WS_HOST_PORT:-4443}:9001" # MQTT over WebSocket (browser clients)
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # pub a message — succeeds only if the broker is up and accepting connections.
      test:
        [
          "CMD-SHELL",
          "mosquitto_pub -h localhost -t healthcheck -m ping >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: ${MOSQUITTO_MEM_LIMIT:-128m}
    networks: [lds-network]

  # MQTTX Web — browser MQTT client (subscribe / publish / watch live). NO login.
  # Point it at the broker over WebSocket: New Connection → Host `localhost`,
  # Port `${MQTT_WS_HOST_PORT}` (4433), Path `/`. (Connections are saved in your
  # browser.) It's a CLIENT, not a broker admin dashboard.
  mqttx:
    image: emqx/mqttx-web:${MQTTX_VERSION:-v1.13.0}
    container_name: lds-mqttx
    profiles: [mqtt, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${MQTT_HOST:-mqtt.test}
      VIRTUAL_PORT: "80"
      CERT_NAME: _.test
    expose:
      - "80"
    ports:
      - "127.0.0.1:${MQTTX_HOST_PORT:-4444}:80"
    mem_limit: ${MQTTX_MEM_LIMIT:-128m}
    networks: [lds-network]

  # ===========================================================================
  # Kafka — KRaft mode (profile: kafka, all)
  #   Dedicated controller + broker, Schema Registry (Apicurio), two Connect
  #   workers (Debezium + generic), and kafka-ui. Topics are provisioned by
  #   `lds up`/`lds kafka-topics`, not a container.
  # ===========================================================================
  # DHI kafka (4.3) ignores KAFKA_* env and reads /opt/kafka/config/server.properties
  # (mounted from configs/kafka/{controller,broker}.properties); its entrypoint
  # auto-formats KRaft storage using KAFKA_CLUSTER_ID (which MUST match across
  # both nodes). Runs as root so it can write the data volume — via the NUMERIC
  # `user: "0:0"`, not `user: root`: the hardened image's /etc/passwd has no
  # `root` entry, so a name would fail ("unable to find user root").
  kafka-controller:
    image: ${DHI_REGISTRY:-dhi.io}/kafka:${KAFKA_VERSION:-4.3-debian13}
    container_name: lds-kafka-controller
    profiles: [kafka, all]
    restart: *restart
    <<: *dns
    user: "0:0"
    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - ./configs/kafka/controller.properties:/opt/kafka/config/server.properties:ro
      - kafka-controller-data:/var/lib/kafka/data
    networks: [lds-network]

  kafka-broker:
    image: ${DHI_REGISTRY:-dhi.io}/kafka:${KAFKA_VERSION:-4.3-debian13}
    container_name: lds-kafka-broker
    profiles: [kafka, all]
    restart: *restart
    <<: *dns
    user: "0:0"
    depends_on:
      kafka-controller:
        condition: service_started
    environment:
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-4420}:29092"
    volumes:
      - ./configs/kafka/broker.properties:/opt/kafka/config/server.properties:ro
      - kafka-broker-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [lds-network]

  # Apicurio Registry (Apache 2.0) — replaces Confluent's cp-schema-registry.
  # In-memory store (dev only: schemas reset on restart; the Avro converter
  # re-registers them via auto-register). Listens on 8080. REST API base is
  # /apis/registry/v2; the Confluent-compatible API is at /apis/ccompat/v7.
  schema-registry:
    image: apicurio/apicurio-registry-mem:${APICURIO_VERSION:-2.6.13.Final}
    container_name: lds-kafka-schema-registry
    profiles: [kafka, all]
    restart: *restart
    <<: *dns
    depends_on:
      kafka-broker:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCHEMA_REGISTRY_HOST_PORT:-4421}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [lds-network]

  # Kafka Connect powered by Debezium — ships MySQL & Postgres CDC connectors.
  connect-debezium:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.0}
    container_name: lds-kafka-connect-debezium
    profiles: [kafka, all]
    restart: *restart
    <<: *dns
    depends_on:
      kafka-broker:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      BOOTSTRAP_SERVERS: kafka-broker:9092
      GROUP_ID: ${CONNECT_GROUP_ID:-connect-cluster}
      CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_TOPIC:-_connect_configs}
      OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_TOPIC:-_connect_offsets}
      STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_TOPIC:-_connect_status}
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Avro via Apicurio Registry (Apache 2.0). ENABLE_APICURIO_CONVERTERS adds
      # the Apicurio converter JARs to the image; the per-connector value.converter
      # config (incl. the dashed `auto-register` prop) lives in the
      # *-connector.json files. Worker defaults stay JSON; keys are JSON.
      ENABLE_APICURIO_CONVERTERS: "true"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # Like the generic worker, allow dropping EXTRA connector plugins (the ones
      # Debezium doesn't bundle) into a host-mounted dir. /kafka/connect keeps the
      # bundled CDC connectors; /kafka/connect-extra is our add-on dir below.
      # (The debezium image maps CONNECT_* env -> worker properties, so this sets
      # plugin.path.) Install with `lds kafka connect-plugin --debezium <name>`.
      CONNECT_PLUGIN_PATH: /kafka/connect,/kafka/connect-extra
    ports:
      - "127.0.0.1:${CONNECT_HOST_PORT:-4423}:8083"
    volumes:
      - ./configs/kafka/connect-debezium:/debezium/connectors-config:ro
      - ./configs/kafka/connect-debezium/plugins:/kafka/connect-extra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8083/connectors >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [lds-network]

  # Generic Kafka Connect — vanilla apache/kafka image (same Connect runtime as
  # the Debezium worker above, but no bundled connectors). For non-CDC plugins
  # (JDBC/S3/Elasticsearch/HTTP sinks, etc.): drop JARs into the mounted
  # plugins dir. Uses its own group + state topics so it won't clash with
  # `connect-debezium`. REST on host ${CONNECT_GENERIC_HOST_PORT:-4422}.
  connect-generic:
    image: ${DHI_REGISTRY:-dhi.io}/kafka:${KAFKA_VERSION:-4.3-debian13}
    container_name: lds-kafka-connect-generic
    profiles: [kafka, all]
    restart: *restart
    <<: *dns
    depends_on:
      kafka-broker:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/connect-distributed.sh"]
    command: ["/etc/kafka-connect/connect-distributed.properties"]
    volumes:
      - ./configs/kafka/connect-generic/connect-distributed.properties:/etc/kafka-connect/connect-distributed.properties:ro
      - ./configs/kafka/connect-generic/plugins:/opt/kafka/connectors
    ports:
      - "127.0.0.1:${CONNECT_GENERIC_HOST_PORT:-4422}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/connectors >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [lds-network]

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-ghcr.io/kafbat/kafka-ui}:${KAFKA_UI_VERSION:-v1.5.0}
    container_name: lds-kafka-ui
    profiles: [kafka, all]
    restart: *restart
    <<: *dns
    depends_on:
      kafka-broker:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect-debezium:8083
      KAFKA_CLUSTERS_0_KAFKACONNECT_1_NAME: generic
      KAFKA_CLUSTERS_0_KAFKACONNECT_1_ADDRESS: http://connect-generic:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-4424}:8080"
    networks: [lds-network]

  # NOTE: topic provisioning used to be a one-shot `kafka-init` service (it
  # lingered as an Exited container). It now lives in scripts/run/kafka-topics.*
  # (run by `lds up` for the kafka profile, or manually via `lds kafka-topics`).

  # ===========================================================================
  # Communication & storage tools (profiles: openwa | rustfs, all)
  #   openwa : WhatsApp API gateway — self-hosted WhatsApp REST API.
  #   rustfs : S3-compatible object storage server with web console.
  #   Both are OFF by default and have their own profiles.
  # ===========================================================================

  # OpenWA — WhatsApp API gateway (rmyndharis fork).  (profile: openwa, all)
  # Full-stack WhatsApp API gateway with NestJS backend + React dashboard.
  # Supports multi-session management, webhooks, and pluggable WhatsApp engines
  # (whatsapp-web.js / baileys). Integrates with the LDS Postgres + Redis
  # services for production-grade persistence and caching.
  # Image published to ghcr.io/rmyndharis/openwa (the rmyndharis/OpenWA fork).
  openwa:
    image: ${OPENWA_IMAGE:-ghcr.io/rmyndharis/openwa}:${OPENWA_VERSION:-latest}
    container_name: lds-openwa
    profiles: [openwa, all]
    restart: *restart
    <<: *dns
    init: true   # zombie-process reaper (required by OpenWA's Node.js runtime)
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      NODE_ENV: ${OPENWA_NODE_ENV:-production}
      LOG_LEVEL: ${OPENWA_LOG_LEVEL:-info}
      PORT: "2785"
      API_MASTER_KEY: ${OPENWA_MASTER_KEY:-openwa-dev-master-key-change-me}
      # Database — LDS Postgres
      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${OPENWA_POSTGRES_DB:-lds_openwa}
      DATABASE_USERNAME: ${OPENWA_POSTGRES_USER:-app}
      DATABASE_PASSWORD: ${OPENWA_POSTGRES_PASSWORD:-app}
      # Cache — LDS Redis
      REDIS_ENABLED: ${OPENWA_REDIS_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Reverse proxy — use domain-specific cert file via CERT_NAME
      # (nginx-proxy v1.6 doesn't trust default cert for HTTPS, so we
      # explicitly point to the wildcard _.test cert)
      VIRTUAL_HOST: ${OPENWA_HOST:-openwa.test}
      VIRTUAL_PORT: "2785"
      CERT_NAME: _.test
    expose:
      - "2785"
    ports:
      - "127.0.0.1:${OPENWA_HOST_PORT:-4507}:2785"
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:2785/api/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    mem_limit: ${OPENWA_MEM_LIMIT:-512m}
    networks: [lds-network]

  # RustFS — S3-compatible object storage.  (profile: rustfs | duckdb | trino, all)
  # High-performance distributed storage with S3 API + web console.
  # When either duckdb or trino profile is active, RustFS auto-starts as their
  # S3 backend. The S3 API is accessible at http://rustfs:9000 from within the
  # Docker network (all services on lds-network).
  # Bucket creation + seed data upload happens inline using curl --aws-sigv4
  # (curl is already installed in the image). No root or Python needed.
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs}:${RUSTFS_VERSION:-latest}
    container_name: lds-rustfs
    profiles: [rustfs, duckdb, trino, plane, all]
    restart: *restart
    <<: *dns
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Start RustFS server in the background
        rustfs --address=:9000 --console-enable &
        RUSTFS_PID=$$!

        # Forward signals so docker stop shuts down RustFS gracefully
        trap 'kill $$RUSTFS_PID 2>/dev/null; exit' TERM INT

        # Wait for the S3 API to be ready
        echo "Waiting for RustFS S3 API..."
        for i in $$(seq 1 30); do
          wget -q -O /dev/null http://127.0.0.1:9000/ 2>/dev/null && break
          sleep 2
        done
        echo "RustFS S3 API ready — initializing buckets..."

        # Create the S3 buckets (idempotent — 409 AlreadyExists is harmless):
        #   $RUSTFS_BUCKET  — shared bucket (duckdb/trino seed data, …)
        #   uploads         — Plane's object-storage bucket (AWS_S3_BUCKET_NAME)
        for b in "$${RUSTFS_BUCKET:-lds-data}" "$${AWS_S3_BUCKET_NAME:-uploads}"; do
          echo "  Creating bucket '$$b'..."
          curl -s -X PUT "http://127.0.0.1:9000/$$b" \
            --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" \
            -o /dev/null || true
        done
        echo "  Buckets ready"

        # Upload seed data files from /data/duckdb/ (if any)
        if [ -d /data/duckdb ]; then
          for f in /data/duckdb/*; do
            [ -f "$$f" ] || continue
            filename=$$(basename "$$f")
            case "$$filename" in
              *.parquet|*.csv|*.json|*.arrow|*.tsv)
                echo "  Uploading: $$filename"
                curl -s -X PUT "http://127.0.0.1:9000/$${RUSTFS_BUCKET:-lds-data}/$$filename" \
                  --aws-sigv4 "aws:amz:us-east-1:s3" \
                  --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" \
                  --upload-file "$$f" \
                  -o /dev/null && echo "    ✓ $$filename" || echo "    ✗ $$filename (skipped)"
                ;;
            esac
          done
        fi

        echo "Init complete"

        # Return to foreground
        wait $$RUSTFS_PID
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      VIRTUAL_HOST: ${RUSTFS_HOST:-rustfs.test}
      VIRTUAL_PORT: "9001"
      CERT_NAME: _.test
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-lds-rustfs-admin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-lds-rustfs-secret-change-me}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-lds-data}
      # Plane's bucket — created alongside RUSTFS_BUCKET on rustfs startup.
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    expose:
      - "9001"
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-4508}:9000"   # S3-compatible API
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-4509}:9001" # Web admin console
    volumes:
      - rustfs-data:/data
      - ./data/duckdb:/data/duckdb:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -o /dev/null http://127.0.0.1:9000/ >/dev/null 2>&1 && curl -s -o /dev/null http://127.0.0.1:9001/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${RUSTFS_MEM_LIMIT:-256m}
    networks: [lds-network]

  # ===========================================================================
  # HeadlessX — undetected self-hosted browser automation / scraping platform.
  #   profile: headlessx, all
  #   - Web dashboard (Next.js) + Express API/worker + remote MCP endpoint (/mcp),
  #     powered by a patched Firefox (Camoufox) browser runtime.
  #   - Built from a local git checkout (HEADLESSX_REPO_PATH, default
  #     ./data/headlessx); `lds headlessx init` clones/updates it before `up`.
  #   - Reuses shared postgres (lds_headlessx DB) + redis (logical DB 4).
  #   - Browser profile (saved Google session etc.) persists in a named volume.
  # ===========================================================================
  headlessx-api:
    build:
      context: ${HEADLESSX_REPO_PATH:-./data/headlessx}
      dockerfile: infra/docker/api.Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/headlessx-api:latest
    container_name: lds-headlessx-api
    profiles: [headlessx, all]
    restart: *restart
    <<: *dns
    init: true   # zombie-process reaper (browser subprocesses)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      headlessx-html-to-md:
        condition: service_healthy
      headlessx-yt-engine:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      # Database — LDS Postgres (lds_headlessx, auto-created via POSTGRES_INIT_SPECS)
      DATABASE_URL: postgresql://${HEADLESSX_POSTGRES_USER:-app}:${HEADLESSX_POSTGRES_PASSWORD:-app}@postgres:5432/${HEADLESSX_POSTGRES_DB:-lds_headlessx}
      # Queue — LDS Redis (dedicated logical DB; queue keys are namespaced by BULLMQ_QUEUE_NAME)
      REDIS_URL: redis://redis:6379/${HEADLESSX_REDIS_DB:-4}
      # Sidecars — in-network service names
      HTML_TO_MARKDOWN_SERVICE_URL: http://headlessx-html-to-md:8080
      HTML_TO_MARKDOWN_TIMEOUT_MS: ${HEADLESSX_HTML_TO_MARKDOWN_TIMEOUT_MS:-60000}
      YT_ENGINE_URL: http://headlessx-yt-engine:8090
      YT_ENGINE_TIMEOUT_MS: ${HEADLESSX_YT_ENGINE_TIMEOUT_MS:-45000}
      PORT: "8000"
      HOST: 0.0.0.0
      NODE_ENV: production
      WEB_PORT: "3000"
      FRONTEND_URL: ${HEADLESSX_FRONTEND_URL:-http://headlessx.test}
      # Required security keys (dev defaults — override in .env)
      DASHBOARD_INTERNAL_API_KEY: ${HEADLESSX_DASHBOARD_INTERNAL_API_KEY:-headlessx-dev-internal-key-change-me}
      CREDENTIAL_ENCRYPTION_KEY: ${HEADLESSX_CREDENTIAL_ENCRYPTION_KEY:-headlessx-dev-encryption-key-change-me}
      # Search providers (optional)
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      # BullMQ queue tuning
      BULLMQ_QUEUE_NAME: ${HEADLESSX_BULLMQ_QUEUE_NAME:-headlessx-jobs}
      QUEUE_WORKER_CONCURRENCY: ${HEADLESSX_QUEUE_WORKER_CONCURRENCY:-2}
      QUEUE_JOB_ATTEMPTS: ${HEADLESSX_QUEUE_JOB_ATTEMPTS:-3}
      QUEUE_JOB_BACKOFF_MS: ${HEADLESSX_QUEUE_JOB_BACKOFF_MS:-5000}
      QUEUE_STREAM_POLL_MS: ${HEADLESSX_QUEUE_STREAM_POLL_MS:-1000}
      # Reverse proxy — API also exposed at headlessx-api.test (MCP + direct access)
      VIRTUAL_HOST: ${HEADLESSX_API_HOST:-headlessx-api.test}
      VIRTUAL_PORT: "8000"
      CERT_NAME: _.test
    expose:
      - "8000"
    ports:
      - "127.0.0.1:${HEADLESSX_API_HOST_PORT:-4516}:8000"
    volumes:
      - headlessx-browser-profile:/app/apps/api/data/browser-profile
      - headlessx-models:/app/apps/api/models
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    mem_limit: ${HEADLESSX_API_MEM_LIMIT:-1g}
    networks: [lds-network]

  headlessx-worker:
    build:
      context: ${HEADLESSX_REPO_PATH:-./data/headlessx}
      dockerfile: infra/docker/api.Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/headlessx-worker:latest
    container_name: lds-headlessx-worker
    profiles: [headlessx, all]
    restart: *restart
    <<: *dns
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      headlessx-html-to-md:
        condition: service_healthy
    command: ["/usr/local/bin/headlessx-worker-entrypoint"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgresql://${HEADLESSX_POSTGRES_USER:-app}:${HEADLESSX_POSTGRES_PASSWORD:-app}@postgres:5432/${HEADLESSX_POSTGRES_DB:-lds_headlessx}
      REDIS_URL: redis://redis:6379/${HEADLESSX_REDIS_DB:-4}
      HTML_TO_MARKDOWN_SERVICE_URL: http://headlessx-html-to-md:8080
      HTML_TO_MARKDOWN_TIMEOUT_MS: ${HEADLESSX_HTML_TO_MARKDOWN_TIMEOUT_MS:-60000}
      YT_ENGINE_URL: http://headlessx-yt-engine:8090
      YT_ENGINE_TIMEOUT_MS: ${HEADLESSX_YT_ENGINE_TIMEOUT_MS:-45000}
      HOST: 0.0.0.0
      NODE_ENV: production
      DASHBOARD_INTERNAL_API_KEY: ${HEADLESSX_DASHBOARD_INTERNAL_API_KEY:-headlessx-dev-internal-key-change-me}
      CREDENTIAL_ENCRYPTION_KEY: ${HEADLESSX_CREDENTIAL_ENCRYPTION_KEY:-headlessx-dev-encryption-key-change-me}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      BULLMQ_QUEUE_NAME: ${HEADLESSX_BULLMQ_QUEUE_NAME:-headlessx-jobs}
      QUEUE_WORKER_CONCURRENCY: ${HEADLESSX_QUEUE_WORKER_CONCURRENCY:-2}
      QUEUE_JOB_ATTEMPTS: ${HEADLESSX_QUEUE_JOB_ATTEMPTS:-3}
      QUEUE_JOB_BACKOFF_MS: ${HEADLESSX_QUEUE_JOB_BACKOFF_MS:-5000}
      QUEUE_STREAM_POLL_MS: ${HEADLESSX_QUEUE_STREAM_POLL_MS:-1000}
    volumes:
      - headlessx-models:/app/apps/api/models
    mem_limit: ${HEADLESSX_WORKER_MEM_LIMIT:-1g}
    networks: [lds-network]

  headlessx-web:
    build:
      context: ${HEADLESSX_REPO_PATH:-./data/headlessx}
      dockerfile: infra/docker/web.Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/headlessx-web:latest
    container_name: lds-headlessx-web
    profiles: [headlessx, all]
    restart: *restart
    <<: *dns
    init: true
    depends_on:
      headlessx-api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      WEB_PORT: "3000"
      # Server-side proxy target for /api/*; browser calls stay same-origin
      INTERNAL_API_URL: http://headlessx-api:8000
      NEXT_PUBLIC_API_URL: http://headlessx-api.test
      NODE_ENV: production
      DASHBOARD_INTERNAL_API_KEY: ${HEADLESSX_DASHBOARD_INTERNAL_API_KEY:-headlessx-dev-internal-key-change-me}
      VIRTUAL_HOST: ${HEADLESSX_HOST:-headlessx.test}
      VIRTUAL_PORT: "3000"
      CERT_NAME: _.test
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${HEADLESSX_WEB_HOST_PORT:-4515}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: ${HEADLESSX_WEB_MEM_LIMIT:-512m}
    networks: [lds-network]

  headlessx-html-to-md:
    build:
      context: ${HEADLESSX_REPO_PATH:-./data/headlessx}
      dockerfile: apps/go-html-to-md-service/Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/headlessx-html-to-md:latest
    container_name: lds-headlessx-html-to-md
    profiles: [headlessx, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PORT: "8080"
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${HEADLESSX_HTML_TO_MD_HOST_PORT:-4517}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${HEADLESSX_HTML_TO_MD_MEM_LIMIT:-256m}
    networks: [lds-network]

  headlessx-yt-engine:
    build:
      context: ${HEADLESSX_REPO_PATH:-./data/headlessx}
      dockerfile: infra/docker/yt-engine.Dockerfile
    image: ${REGISTRY:-local}/local-dev-stack/headlessx-yt-engine:latest
    container_name: lds-headlessx-yt-engine
    profiles: [headlessx, all]
    restart: *restart
    <<: *dns
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      YT_ENGINE_PORT: "8090"
      YT_ENGINE_TEMP_DIR: /app/tmp/yt-engine
      YT_ENGINE_JOB_TTL_HOURS: ${HEADLESSX_YT_ENGINE_JOB_TTL_HOURS:-12}
    expose:
      - "8090"
    ports:
      - "127.0.0.1:${HEADLESSX_YT_ENGINE_HOST_PORT:-4519}:8090"
    volumes:
      - headlessx-yt-engine-tmp:/app/tmp/yt-engine
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${HEADLESSX_YT_ENGINE_MEM_LIMIT:-512m}
    networks: [lds-network]

  # ===========================================================================
  # Playwright — End-To-End testing runner + HTML report viewer.
  #   profile: playwright, all
  #   - `playwright` : long-running runner (official image, browsers pre-installed)
  #     joined to the IN-NETWORK DNS (10.99.0.53 -> proxy) so its browsers can
  #     test http://<app>.test services like any other client on lds-network.
  #     Tests live in data/playwright/projects (scaffold: `lds playwright init`).
  #   - `playwright-report` : nginx viewer serving data/playwright/reports/
  #     (Playwright HTML reports) at playwright.test — same pattern as semgrep/trivy.
  # ===========================================================================
  playwright:
    image: mcr.microsoft.com/playwright:${PLAYWRIGHT_VERSION:-v1.62.1-noble}
    container_name: lds-playwright
    profiles: [playwright, all]
    restart: *restart
    <<: *dns
    init: true   # zombie-process reaper (browser subprocesses)
    shm_size: 1gb   # Chromium needs a generous /dev/shm
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Keep the runner warm so `lds playwright run` is instant (no cold start).
        echo "Playwright runner ready — run tests with: lds playwright run <project>"
        exec tail -f /dev/null
    environment:
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - ./data/playwright/projects:/e2e/projects
      - ./data/playwright/reports:/e2e/reports
    ports:
      # UI mode server (served on 0.0.0.0 inside the container) — open the host port in your browser
      - "127.0.0.1:${PLAYWRIGHT_UI_HOST_PORT:-4527}:8787"
    mem_limit: ${PLAYWRIGHT_MEM_LIMIT:-1g}
    networks:
      - lds-network
      - lds-dnsnet
    dns:
      - 10.99.0.53   # in-network *.test -> proxy (same as ZAP)
      - 127.0.0.11   # Docker's embedded DNS for everything else

  playwright-report:
    image: lds/nginx:${NGINX_VERSION:-1.27}
    container_name: lds-playwright-report
    profiles: [playwright, all]
    restart: *restart
    <<: *dns
    environment:
      VIRTUAL_HOST: ${PLAYWRIGHT_REPORT_HOST:-playwright.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${PLAYWRIGHT_REPORT_HOST_PORT:-4526}:8080"
    volumes:
      - ./data/playwright/reports:/usr/share/nginx/html
      - ./configs/playwright/reports/index.html:/usr/share/nginx/html/index.html:ro
      - ./configs/playwright/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: ${PLAYWRIGHT_REPORT_MEM_LIMIT:-64m}
    networks: [lds-network]

  # ===========================================================================
  # ERPNext — full ERP suite on the Frappe framework.  (profile: erpnext, all)
  #   Accounting, CRM, HR, Inventory, Manufacturing, eCommerce — the whole
  #   ERPNext app. DB = ERPNEXT_DB_TYPE: `postgres` (DEFAULT — the shared
  #   lds-postgres; ERPNext's Postgres port landed upstream in 2026) or `mariadb`
  #   (the shared lds-mariadb — upstream-tested alternative). Cache/queues =
  #   the SHARED Redis (logical DBs 5/6). `lds up erpnext` brings postgres +
  #   redis along automatically (both are members of this profile). One-shots
  #   (erpnext-configurator / erpnext-create-site) bootstrap the site on first
  #   boot — several minutes of migrations — then skip on later `up`s.
  #   HEAVY: ~3-6 GB RAM across the services + multi-GB image pulls of
  #   frappe/erpnext (Docker Hub); off by default (LDS_ENABLE_ERPNEXT).
  #   Web UI at erpnext.test; login Administrator / ${ERPNEXT_ADMIN_PASSWORD}.
  # ===========================================================================

  # One-shot bootstrap: writes sites/common_site_config.json (DB + Redis + port
  # settings). Runs to completion on every `up` (idempotent bench set-config);
  # backend/workers wait for it via depends_on: service_completed_successfully.
  # `$${VAR}` escapes are expanded by the CONTAINER's shell from its env block.
  # DB = ERPNEXT_DB_TYPE: `postgres` (default — shared lds-postgres) or `mariadb`
  # (shared lds-mariadb). Redis = shared lds-redis, logical DBs 5 (cache) / 6
  # (queue). root creds are written into common_site_config.json so the
  # create-site one-shot can run bench new-site non-interactively.
  erpnext-configurator:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-configurator
    profiles: [erpnext, all]
    restart: "no"
    <<: *dns
    entrypoint: ["bash", "-c"]
    command:
      - |
        ls -1 apps > sites/apps.txt;
        # bind-mounted sites/ hides the image's common_site_config.json ("{}"),
        # and bench set-config needs it to exist as valid JSON first
        if [ ! -f sites/common_site_config.json ]; then echo '{}' > sites/common_site_config.json; fi;
        if [ "$${ERPNEXT_DB_TYPE}" = "postgres" ]; then
        DBHOST=postgres; DBPORT=5432; ROOTLOGIN=$${POSTGRES_USER}; ROOTPASSWORD=$${POSTGRES_PASSWORD};
        else
        DBHOST=mariadb; DBPORT=3306; ROOTLOGIN=root; ROOTPASSWORD=$${MARIADB_ROOT_PASSWORD};
        fi
        bench set-config -g db_host $$DBHOST;
        bench set-config -gp db_port $$DBPORT;
        bench set-config -g db_type $${ERPNEXT_DB_TYPE};
        bench set-config -g root_login $$ROOTLOGIN;
        bench set-config -g root_password "$$ROOTPASSWORD";
        bench set-config -g redis_cache "redis://$${REDIS_CACHE}";
        bench set-config -g redis_queue "redis://$${REDIS_QUEUE}";
        bench set-config -g redis_socketio "redis://$${REDIS_QUEUE}";
        bench set-config -gp socketio_port $${SOCKETIO_PORT}
    environment:
      ERPNEXT_DB_TYPE: ${ERPNEXT_DB_TYPE:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      REDIS_CACHE: redis:6379/${ERPNEXT_REDIS_CACHE_DB:-5}
      REDIS_QUEUE: redis:6379/${ERPNEXT_REDIS_QUEUE_DB:-6}
      SOCKETIO_PORT: "9000"
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./configs/erpnext/patches/stock_balance.py:/home/frappe/frappe-bench/apps/erpnext/erpnext/stock/stock_balance.py:ro
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    mem_limit: ${ERPNEXT_CONFIGURATOR_MEM_LIMIT:-512m}
    networks: [lds-network]

  # One-shot site creation: `bench new-site ... --install-app erpnext` on FIRST
  # boot only (skips when data/erpnext/sites/<site> already exists). Creates the
  # site DB on the SHARED lds-postgres (default) or lds-mariadb, using the root
  # creds written into common_site_config.json by the configurator above.
  erpnext-create-site:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-create-site
    profiles: [erpnext, all]
    restart: "no"
    <<: *dns
    entrypoint: ["bash", "-c"]
    command:
      - |
        if [ "$${ERPNEXT_DB_TYPE}" = "postgres" ]; then
        wait-for-it -t 120 postgres:5432;
        else
        wait-for-it -t 120 mariadb:3306;
        fi
        wait-for-it -t 120 redis:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
        [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
        [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
        echo "Waiting for sites/common_site_config.json to be created";
        sleep 5;
        if (( `date +%s`-start > 120 )); then
        echo "could not find sites/common_site_config.json with required keys";
        exit 1
        fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/$${ERPNEXT_SITE}" ]; then
        echo "Site $${ERPNEXT_SITE} already exists, skipping creation";
        else
        if [ "$${ERPNEXT_DB_TYPE}" = "postgres" ]; then
        bench new-site --db-type postgres --db-host postgres --db-name $${ERPNEXT_DB_NAME} --admin-password=$${ERPNEXT_ADMIN_PASSWORD} --install-app erpnext --set-default $${ERPNEXT_SITE};
        else
        bench new-site --db-type mariadb --db-host mariadb --db-name $${ERPNEXT_DB_NAME} --mariadb-user-host-login-scope='%' --admin-password=$${ERPNEXT_ADMIN_PASSWORD} --db-root-username=root --db-root-password=$${MARIADB_ROOT_PASSWORD} --install-app erpnext --set-default $${ERPNEXT_SITE};
        fi
        fi
    environment:
      ERPNEXT_DB_TYPE: ${ERPNEXT_DB_TYPE:-postgres}
      ERPNEXT_DB_NAME: ${ERPNEXT_DB_NAME:-lds_erpnext}
      ERPNEXT_SITE: ${ERPNEXT_SITE:-frontend}
      ERPNEXT_ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./configs/erpnext/patches/stock_balance.py:/home/frappe/frappe-bench/apps/erpnext/erpnext/stock/stock_balance.py:ro
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: ${ERPNEXT_CREATE_SITE_MEM_LIMIT:-2g}
    networks: [lds-network]

  erpnext-backend:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-backend
    profiles: [erpnext, all]
    restart: *restart
    <<: *dns
    environment:
      GUNICORN_THREADS: ${ERPNEXT_GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${ERPNEXT_GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${ERPNEXT_GUNICORN_TIMEOUT:-120}
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./configs/erpnext/patches/stock_balance.py:/home/frappe/frappe-bench/apps/erpnext/erpnext/stock/stock_balance.py:ro
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: ${ERPNEXT_BACKEND_MEM_LIMIT:-2g}
    networks: [lds-network]

  erpnext-frontend:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-frontend
    profiles: [erpnext, all]
    restart: *restart
    <<: *dns
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: erpnext-backend:8000
      SOCKETIO: erpnext-websocket:9000
      # nginx serves the site dir named FRAPPE_SITE_NAME_HEADER regardless of
      # the external Host header, so erpnext.test works with no extra config.
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE:-frontend}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
      VIRTUAL_HOST: ${ERPNEXT_HOST:-erpnext.test}
      VIRTUAL_PORT: "8080"
      CERT_NAME: _.test
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${ERPNEXT_HOST_PORT:-4529}:8080"
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      - erpnext-backend
      - erpnext-websocket
    mem_limit: ${ERPNEXT_FRONTEND_MEM_LIMIT:-256m}
    networks: [lds-network]

  erpnext-worker:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-worker
    profiles: [erpnext, all]
    restart: *restart
    <<: *dns
    command: ["bench", "worker", "--queue", "short,default"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis:6379/${ERPNEXT_REDIS_CACHE_DB:-5}
      FRAPPE_REDIS_QUEUE: redis://redis:6379/${ERPNEXT_REDIS_QUEUE_DB:-6}
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./configs/erpnext/patches/stock_balance.py:/home/frappe/frappe-bench/apps/erpnext/erpnext/stock/stock_balance.py:ro
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: ${ERPNEXT_WORKER_MEM_LIMIT:-1g}
    networks: [lds-network]

  erpnext-worker-long:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-worker-long
    profiles: [erpnext, all]
    restart: *restart
    <<: *dns
    command: ["bench", "worker", "--queue", "long,default,short"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis:6379/${ERPNEXT_REDIS_CACHE_DB:-5}
      FRAPPE_REDIS_QUEUE: redis://redis:6379/${ERPNEXT_REDIS_QUEUE_DB:-6}
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./configs/erpnext/patches/stock_balance.py:/home/frappe/frappe-bench/apps/erpnext/erpnext/stock/stock_balance.py:ro
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: ${ERPNEXT_WORKER_LONG_MEM_LIMIT:-1g}
    networks: [lds-network]

  erpnext-scheduler:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-scheduler
    profiles: [erpnext, all]
    restart: *restart
    <<: *dns
    command: ["bench", "schedule"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis:6379/${ERPNEXT_REDIS_CACHE_DB:-5}
      FRAPPE_REDIS_QUEUE: redis://redis:6379/${ERPNEXT_REDIS_QUEUE_DB:-6}
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./configs/erpnext/patches/stock_balance.py:/home/frappe/frappe-bench/apps/erpnext/erpnext/stock/stock_balance.py:ro
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: ${ERPNEXT_SCHEDULER_MEM_LIMIT:-512m}
    networks: [lds-network]

  erpnext-websocket:
    image: frappe/erpnext:v${ERPNEXT_VERSION:-16.31.1}
    container_name: lds-erpnext-websocket
    profiles: [erpnext, all]
    restart: *restart
    <<: *dns
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis:6379/${ERPNEXT_REDIS_CACHE_DB:-5}
      FRAPPE_REDIS_QUEUE: redis://redis:6379/${ERPNEXT_REDIS_QUEUE_DB:-6}
    volumes:
      - ./data/erpnext/sites:/home/frappe/frappe-bench/sites
      - ./configs/erpnext/patches/stock_balance.py:/home/frappe/frappe-bench/apps/erpnext/erpnext/stock/stock_balance.py:ro
      - ./data/erpnext/logs:/home/frappe/frappe-bench/logs
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    mem_limit: ${ERPNEXT_WEBSOCKET_MEM_LIMIT:-256m}
    networks: [lds-network]

# -----------------------------------------------------------------------------
# Shared network — INDEPENDENT (external). Create it once, ever:
#   docker network create lds-network      (or run scripts/run/init.sh | init.bat)
# Nothing owns its lifecycle, so `docker compose down` never destroys it and
# projects never hit "network not found". This stack and all projects attach
# to it as equals. Projects declare the same:
#   networks:
#     lds-network:
#       external: true
# -----------------------------------------------------------------------------
networks:
  lds-network:
    name: ${NETWORK_NAME:-lds-network}
    external: true
  # Internal management net for in-network DNS: gives the dns container a STATIC
  # IP (10.99.0.53) so other services can use it as their `dns:` server (compose
  # `dns:` accepts IPs only). Subnet chosen OUTSIDE Docker's default bridge pool
  # (172.17-172.31) to avoid colliding with lds-network or other docker nets.
  # Host-facing DNS on lds-network/eth0 is untouched.
  lds-dnsnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.0.0/24

volumes:
  mysql-data:
  mariadb-data:
  mssql-data:
  oracle-data:
  postgres-data:
  mongo-data:
  mongo-config:
  redis-data:
  valkey-data:
  kafka-controller-data:
  kafka-broker-data:
  mosquitto-data:
  vaultwarden-data:
  openwa-data:
  rustfs-data:
  duckdb-data:
  prometheus-data:
  grafana-data:
  headlessx-browser-profile:
  headlessx-models:
  headlessx-yt-engine-tmp:
  snapotter-workspace:
  # Plane CE (profile: plane) — vendor volume set, project-scoped:
  # local-dev-stack_{logs_*,proxy_*}. rabbitmq_data is now the SHARED broker
  # volume (service rabbitmq); pgdata/redisdata/uploads are gone: Plane uses
  # the shared postgres/redis and the rustfs-data volume (uploads bucket).
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
