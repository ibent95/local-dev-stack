# =============================================================================
# HTTPS opt-in overlay — adds TLS to the edge proxy.
# -----------------------------------------------------------------------------
# This file is NOT used on its own. `lds up` reads LDS_ENABLE_HTTPS from .env and,
# when true (and a proxy/php profile is running), layers it on top of the base
# file:  docker compose -f docker-compose.yml -f docker-compose.https.yml …
# Compose MERGES this into the `proxy` service — the extra port, the certs mount,
# and HTTPS_METHOD are ADDED to the base definition (lists concatenate).
#
# First generate the wildcard dev cert (once):   lds certs
#   -> writes configs/proxy/certs/_.test.{crt,key}, which nginx-proxy picks up
#      as the wildcard cert for every *.test / localhost vhost.
#   -> The _.test.crt naming follows nginx-proxy's convention where _ = *.
# =============================================================================
name: local-dev-stack

services:
  proxy:
    ports:
      # TLS listener. Visit https://<name>.test (or https://localhost:<port>).
      - "127.0.0.1:${WEB_HTTPS_PORT:-443}:443"
    environment:
      # noredirect = serve BOTH http and https (don't force a redirect), so any
      # existing http://…​.test workflow keeps working. Set HTTPS_METHOD=redirect
      # in .env to force http -> https.
      HTTPS_METHOD: ${HTTPS_METHOD:-noredirect}
    volumes:
      # Dev certs minted by `lds certs`. The wildcard _.test.crt covers every
      # *.test vhost (nginx-proxy wildcard convention: _ = *). cert SANs cover
      # *.test, test, and localhost.
      - ./configs/proxy/certs:/etc/nginx/certs:ro

  # The php container serves `localhost` + the regex `*.test` catch-all (all PHP
  # project hosts). Explicit CERT_NAME ensures the wildcard cert is used even
  # for localhost and regex-based vhosts. Harmless when HTTPS is off (this
  # overlay isn't applied then).
  php:
    environment:
      CERT_NAME: _.test

  # (Optional) sonarqube-mcp host through the proxy: when SONARQUBE_MCP_HOST is
  # set in .env, this overlay gives sonarqube-mcp.test a vhost + wildcard cert so
  # it's reachable inside the network. The Zed URL is still loopback 127.0.0.1:4549.
  sonarqube-mcp:
    environment:
      CERT_NAME: _.test

  # Keycloak must be browsed at EXACTLY the origin pinned in KC_HOSTNAME
  # (KEYCLOAK_PUBLIC_URL): the admin console's third-party-cookie check iframe
  # is built from that URL and the console page's CSP is `frame-src 'self'`, so
  # a scheme mismatch (page https vs iframe http) blocks the frame and
  # keycloak.js throws "Timeout when waiting for 3rd party check iframe
  # message." The global method stays noredirect, but auth.test alone forces
  # http -> https so http://auth.test, the dashboard link and https://auth.test
  # all converge on the pinned https:// origin. Per-container HTTPS_METHOD
  # overrides the proxy-wide default (nginx-proxy docs).
  keycloak:
    environment:
      HTTPS_METHOD: redirect
